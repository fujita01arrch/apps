    // ============================================================
    // 共通コンポーネント：確認/アラートダイアログ

    // ============================================================
    // 共通コンポーネント：Stepper（ADV入力手間最小化の中核）
    // ============================================================
    const Stepper = ({ value, onChange, min = 0, unit }) => {
      const v = value ?? 0;
      const dec = () => onChange(Math.max(min, v - 1));
      const inc = () => onChange(v + 1);
      return (
        <div className="flex items-center gap-1.5 shrink-0">
          <button
            onClick={dec}
            className="w-10 h-10 flex items-center justify-center border border-gray-300 text-gray-600 text-lg active:bg-gray-200 hover:bg-gray-100 transition-colors"
          >−</button>
          <input
            type="number" inputMode="numeric" value={v}
            onChange={(e) => onChange(Math.max(min, Number(e.target.value) || 0))}
            className="w-14 h-10 text-center border border-gray-300 text-sm focus:outline-none focus:border-gray-500"
          />
          <button
            onClick={inc}
            className="w-10 h-10 flex items-center justify-center border border-gray-300 text-gray-600 text-lg active:bg-gray-200 hover:bg-gray-100 transition-colors"
          >＋</button>
          {unit && <span className="text-[10px] text-gray-400 ml-1 w-6">{unit}</span>}
        </div>
      );

    // ============================================================
    // 共通コンポーネント：TapRow

    // 「どのくらい足りなそうか」を体感でワンタップだけで伝えられるようにする。
    // ============================================================
    const TapRow = ({ item, count, onTap, onReset, children }) => {
      const isLow = count > 0;
      return (
        <div className={`border-b border-gray-100 last:border-b-0 ${isLow ? 'bg-rose-50' : ''}`}>
          <div className="w-full flex items-center justify-between py-3.5 px-3">

              <div className={`text-sm ${isLow ? 'text-rose-600 font-medium' : 'text-gray-800'}`}>{item.name}</div>
              <div className="text-[10px] text-gray-400 tracking-wide mt-0.5">
                必要在庫数：{item.reorderPoint != null ? `${item.reorderPoint}${item.stockUnit}以上` : '未設定'}
              </div>
            </button>
            <div className="flex items-center gap-1.5 shrink-0">
              <button
                onClick={onTap}
                className={`text-[11px] tracking-widest px-3 py-1.5 transition-colors ${isLow ? 'bg-rose-500 text-white' : 'border border-gray-300 text-gray-400'}`}
              >{isLow ? `発注が必要 ×${count}${item.orderUnit || ''}` : '在庫OK'}</button>
              {isLow && (
                <button
                  onClick={onReset} aria-label="取り消し"

    // ============================================================
    // ユーティリティ
    // ============================================================
    // 拠点タイプごとに、その拠点で扱う備品カテゴリを絞り込む。
    // 鴨江事務所（予備在庫）は「鴨江個人用」品目のみ、それ以外の拠点（モデルハウス・完成見学会）は
    // 「鴨江個人用」以外の品目のみを対象にする（無関係な品目が入り混じって表示されるのを防ぐ）。
    function isItemApplicableToLocation(item, location) {
      const isPersonalOnly = item.category === '鴨江個人用';
      return location.type === 'office_reserve' ? isPersonalOnly : !isPersonalOnly;
    }
    function daysSince(isoString) {
      if (!isoString) return Infinity;
      const diffMs = Date.now() - new Date(isoString).getTime();
      return Math.floor(diffMs / (1000 * 60 * 60 * 24));
    }
    function formatRelativeDate(isoString) {
      if (!isoString) return '未確認';
      const d = daysSince(isoString);
      if (d <= 0) return '今日';
      if (d === 1) return '昨日';
      return `${d}日前`;
    }
    function stockDocId(locationId, itemId) { return `${locationId}_${itemId}`; }

    // スタッフ管理画面から先に登録できるようにするため（Firebase AuthのUIDはログインするまで
    // 分からず、先に登録できないため）。
    function userDocId(email) { return (email || '').trim().toLowerCase(); }

    // と同じ仕様にしておくこと。
    function renderTemplate(tpl, vars) {
      return String(tpl || '').replace(/\{\{(\w+)\}\}/g, (_, key) => (vars[key] !== undefined && vars[key] !== null) ? String(vars[key]) : '');
    }

      orderRequestMarketing: 'お疲れ様です。下記備品、在庫が少なくなってきましたのでご用意をお願いできますでしょうか。\n\n{{sections}}\n\nご用意いただけそうな時期が分かりましたらお知らせください。よろしくお願いいたします。',
      orderRequestAdvSelf: '下記備品はADV本人手配のため、必要に応じてご準備をお願いします。\n\n{{sections}}',

    };

      const saved = config.messageTemplates && config.messageTemplates[key];

      { id: 'completion-b', name: '完成見学会②（中央区寺脇）', type: 'completion_viewing', keywords: ['中央区寺脇', '寺脇'], order: 5 },

      ['掃除用品', 'クイックルワイパーシート', '袋', 0.5, 0.5, '袋', '', '業務管理', ''],
      ['掃除用品', 'キッチン用スポンジ', '個', 1, 2, '個', '', '業務管理', ''],
      ['掃除用品', 'キッチン用スプレー', '本', 1, 1, '本', '', '業務管理', ''],
      ['掃除用品', 'コロコロ替え', '本', 1, 3, '袋', '3本入り', '業務管理', ''],
      // 鴨江個人用（自動発注対象外、在庫の見える化のみ）
      ['鴨江個人用', '個人用ゴミ袋', '袋', null, null, '袋', '', 'ADV本人手配', ''],
      ['鴨江個人用', '個人用ウェットティッシュ', '個', null, null, '個', '', 'ADV本人手配', ''],
    ];

    function buildSeedItems() {
      return SEED_ITEM_ROWS.map(([category, name, stockUnit, reorderPoint, fullStockQty, orderUnit, orderUnitLabel, orderRole, note], idx) => ({
        id: `item-${idx + 1}`,
        category, name, stockUnit,
        fullStockQty, reorderPoint,
        orderUnit: orderUnit || stockUnit, orderUnitLabel: orderUnitLabel || '',
        tapIncrement: 1, tapMax: 3, // 1タップあたりの発注数量の増分／タップの上限（orderUnit単位。設定画面から品目ごとに調整可）
        orderRole, note, isActive: true, order: idx,
      }));
    }

    async function ensureSeedData(setSeeding) {
      const configSnap = await getDoc(docRef('system_config', 'default'));
      if (configSnap.exists() && (configSnap.data().seedVersion || 0) >= SEED_VERSION) return;
      setSeeding && setSeeding(true);
      try {
        for (const loc of SEED_LOCATIONS) {
          const exists = await getDoc(docRef('locations', loc.id));
          if (!exists.exists()) {
            await setDoc(docRef('locations', loc.id), { ...loc, isActive: true, lastCheckedAt: null, lastCheckedBy: null, createdAt: nowIso(), updatedAt: nowIso() });
          }
        }
        const items = buildSeedItems();
        for (const item of items) {
          const exists = await getDoc(docRef('equipmentItems', item.id));
          if (!exists.exists()) {
            await setDoc(docRef('equipmentItems', item.id), { ...item, createdAt: nowIso(), updatedAt: nowIso() });
          }
        }
        await setDoc(docRef('system_config', 'default'), {
          staleCheckDays: 14,
          chatworkRoomIds: { operations: '', marketing: '' },
          autoSendEnabled: false,
          seedVersion: SEED_VERSION,
        }, { merge: true });
      } finally {
        setSeeding && setSeeding(false);
      }
    }

    // ============================================================
    // ログイン画面
    // ============================================================
    const LoginView = ({ domainError }) => {
      const [error, setError] = useState('');
      const handleLogin = async () => {
        setError('');
        try {
          const provider = new GoogleAuthProvider();
          provider.setCustomParameters({ hd: ALLOWED_LOGIN_DOMAIN }); // 社内ドメインのアカウントを候補に絞るヒント（強制ではないため、ログイン後にも念のため検証する）
          await signInWithPopup(auth, provider);
        } catch (e) {
          setError('ログインに失敗しました。もう一度お試しください。');
        }
      };
      return (
        <div className="min-h-screen flex items-center justify-center bg-[#f9f9f9] px-6">
          <div className="max-w-sm w-full text-center">
            <BoxIcon className="w-10 h-10 mx-auto text-gray-700 mb-4" />
            <h1 className="font-serif tracking-[0.15em] text-xl text-gray-800 mb-1">モデルハウス備品管理</h1>
            <p className="text-[10px] text-gray-400 tracking-widest uppercase mb-8">Equipment Manager</p>
            <button
              onClick={handleLogin}
              className="w-full bg-gray-800 text-white hover:bg-gray-900 transition-colors px-6 py-3 text-xs tracking-widest shadow-sm"
            >Googleアカウントでログイン</button>
            {error && <p className="text-rose-500 text-xs mt-4">{error}</p>}
            {domainError && <p className="text-rose-500 text-xs mt-4">社内（{ALLOWED_LOGIN_DOMAIN}）のGoogleアカウントでログインしてください。</p>}
          </div>
        </div>
      );
    };

    // ============================================================
    // 拠点選択
    // ============================================================
    const LocationPicker = ({ locations, staleCheckDays, onSelect }) => {
      const list = locations.filter(l => l.isActive).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      return (
        <div className="p-4 space-y-2 max-w-xl mx-auto">
          {list.map(loc => {
            const stale = daysSince(loc.lastCheckedAt) >= staleCheckDays;
            return (
              <button
                key={loc.id}
                onClick={() => onSelect(loc)}
                className="w-full flex items-center justify-between bg-white border border-gray-200 hover:border-gray-400 hover:shadow-sm transition-all px-4 py-4 text-left"
              >
                <div className="min-w-0">
                  <div className="text-sm text-gray-800">{loc.name}</div>
                  <div className={`text-[10px] tracking-wide mt-1 ${stale ? 'text-rose-500' : 'text-gray-400'}`}>
                    最終確認：{formatRelativeDate(loc.lastCheckedAt)}
                    {loc.lastCheckedBy ? `（${loc.lastCheckedBy.name}）` : ''}
                    {stale && ' ・要確認'}
                  </div>
                </div>
                <ChevronRightIcon className="w-4 h-4 text-gray-300 shrink-0" />
              </button>
            );
          })}
          {list.length === 0 && <p className="text-center text-xs text-gray-400 py-10">拠点が登録されていません（設定から追加してください）</p>}
        </div>
      );
    };

    // ============================================================
    // 在庫確認フォーム（ADVの主要動線。入力手間最小化を最優先に設計）
    // ============================================================
    const STATUS_BADGE_CLS = {
      '依頼送信済み': 'bg-amber-100 text-amber-700',
      '配達待ち': 'bg-sky-100 text-sky-700',
    };
    // 在庫確認画面の行全体の背景色（バッジと同系色にして、一目でステータスの違いが分かるようにする）
    const STATUS_ROW_BG_CLS = {
      '依頼送信済み': 'bg-amber-50',
      '配達待ち': 'bg-sky-50',
    };

    const StockCheckForm = ({ location, items, stockLevels, orders, user, isRegistered, onBack, onSubmitted, showAlert, showConfirm }) => {
      const isWithdrawal = location.type === 'office_reserve';
      const relevantItems = items
        .filter(i => i.isActive && isItemApplicableToLocation(i, location))
        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

      // 拠点×品目ごとに、進行中（配達済みでない）の発注があるかを引けるようにしておく。
      // 「発注が必要」とタップして送信した後、他の人がこの画面を開いても
      // 発注状況が分かるようにするため（発注済みかどうかをここに表示する）。
      const orderByItemId = useMemo(() => {
        const map = {};
        (orders || []).forEach(o => {
          if (o.locationId !== location.id || o.status === '配達済み') return;
          o.items.forEach(i => { map[i.itemId] = { order: o, line: i }; });
        });
        return map;
      }, [orders, location.id]);

      // items はFirestoreのonSnapshotが発火するたびに新しい配列参照になる（中身が同じでも）。
      // これを直接useMemoの依存配列に入れると、無関係な変更（他ユーザーの編集や再接続）のたびに
      // ADVが入力中のtapCounts/withdrawValuesが無警告でリセットされてしまうため、
      // 品目IDの集合という「内容が変わらない限り安定した値」を依存配列に使う。
      const itemIdsKey = useMemo(() => relevantItems.map(i => i.id).join(','), [relevantItems]);

      // 持ち出しモード（鴨江事務所）は従来通り数量を直接入力する
      const initialWithdrawValues = useMemo(() => {
        const v = {};
        relevantItems.forEach(item => { v[item.id] = 0; });
        return v;
      }, [location.id, itemIdsKey]);

      // 在庫確認モード（モデルハウス／見学会）は「在庫OK／発注が必要×N」のワンタップ判定に統一。
      // 正確な残数を毎回数える負担をなくし、タップ回数＝発注してほしい度合い（ロット数の目安）を記録する。
      // N（tapCount）は品目ごとに設定した tapIncrement 刻みで増え、tapMax で頭打ちになる。
      const initialTapCounts = useMemo(() => {
        const v = {};
        relevantItems.forEach(item => { v[item.id] = 0; });
        return v;
      }, [location.id, itemIdsKey]);

      const [withdrawValues, setWithdrawValues] = useState(initialWithdrawValues);
      const [tapCounts, setTapCounts] = useState(initialTapCounts);
      const [detailValues, setDetailValues] = useState({});
      const [detailOpen, setDetailOpen] = useState({});
      const [submitting, setSubmitting] = useState(false);

      useEffect(() => { setWithdrawValues(initialWithdrawValues); }, [initialWithdrawValues]);
      useEffect(() => { setTapCounts(initialTapCounts); setDetailValues({}); setDetailOpen({}); }, [initialTapCounts]);

      const tapItem = (item) => {
        const increment = item.tapIncrement ?? 1;
        const max = item.tapMax ?? 3;
        setTapCounts(prev => ({ ...prev, [item.id]: Math.min((prev[item.id] ?? 0) + increment, max) }));
      };
      const resetItem = (itemId) => {
        setTapCounts(prev => ({ ...prev, [itemId]: 0 }));
        setDetailOpen(prev => ({ ...prev, [itemId]: false }));
      };
      const setWithdrawValue = (itemId, v) => setWithdrawValues(prev => ({ ...prev, [itemId]: v }));
      const setDetailValue = (itemId, v) => setDetailValues(prev => ({ ...prev, [itemId]: v }));
      const toggleDetailOpen = (itemId, item) => {
        setDetailOpen(prev => {
          const next = !prev[itemId];
          if (next && detailValues[itemId] === undefined) {
            setDetailValues(dv => ({ ...dv, [itemId]: item.reorderPoint ?? 0 }));
          }
          return { ...prev, [itemId]: next };
        });
      };

      const submit = async (allUnchanged) => {
        setSubmitting(true);
        try {
          const submittedBy = { uid: user.uid, name: user.displayName || user.email, email: user.email };
          const ts = nowIso();
          const mode = isWithdrawal ? 'withdrawal' : 'checkin';

          const lines = relevantItems
            .filter(item => {
              if (orderByItemId[item.id]) return false; // 発注処理中（ordersドキュメントあり）は対象外
              if (!isWithdrawal) {
                const level = stockLevels[stockDocId(location.id, item.id)];
                if (level && level.belowReorderPoint) return false; // 依頼中（管理者確認待ち）も対象外。「全品目在庫OK」で誤って上書きされないようにする
              }
              return true;
            })
            .map(item => {
            const level = stockLevels[stockDocId(location.id, item.id)];
            const previousCount = level ? level.currentCount : (item.fullStockQty ?? null);

            if (isWithdrawal) {
              const taken = withdrawValues[item.id] ?? 0;
              const newCount = Math.max(0, (previousCount ?? 0) - taken);
              const belowReorderPoint = item.reorderPoint != null && newCount <= item.reorderPoint;
              return { itemId: item.id, itemName: item.name, unit: item.stockUnit, previousCount, newCount, delta: -taken, belowReorderPoint };
            }
            if (allUnchanged) {
              // 「全品目在庫OK」と明示的に申告しているため、過去に発注要フラグが立っていても
              // ここでクリアする（残していると発注済み扱いにならず永久に警告が残り続ける）。
              return { itemId: item.id, itemName: item.name, unit: item.stockUnit, previousCount, newCount: previousCount, delta: 0, belowReorderPoint: false, requestedLots: 0 };
            }
            const requestedLots = tapCounts[item.id] ?? 0;
            const isLow = requestedLots > 0;
            if (!isLow) {
              // 在庫OK：触っていないので前回値を維持したまま「確認済み」だけ記録する
              return { itemId: item.id, itemName: item.name, unit: item.stockUnit, previousCount, newCount: previousCount, delta: 0, belowReorderPoint: false, requestedLots: 0 };
            }
            const hasDetail = detailOpen[item.id] && detailValues[item.id] !== undefined;
            const newCount = hasDetail ? detailValues[item.id] : (item.reorderPoint ?? 0);
            return { itemId: item.id, itemName: item.name, unit: item.stockUnit, previousCount, newCount, delta: (previousCount != null ? newCount - previousCount : null), belowReorderPoint: true, requestedLots };
          });

          // 複数ドキュメントへの書き込みを1つのバッチにまとめ、途中で通信が切れても
          // 「一部だけ反映された中途半端な状態」にならないようにする（全部成功 or 全部失敗）。
          const batch = writeBatch(db);
          batch.set(doc(col('stockCheckSessions')), {
            locationId: location.id, locationName: location.name, mode,
            allUnchanged: !!allUnchanged, submittedBy, submittedAt: ts,
            linkedOrderId: null, lines, memo: '',
          });
          // 担当者別の統計は、35日で削除される生ログ（stockCheckSessions）からではなく、
          // ここで積み上げる永続カウンター（staffActivityStats）から算出する。
          // こうすることで、生ログを定期削除してデータ量を抑えつつ、統計自体は消えずに残る。
          if (!isWithdrawal) {
            const hasShortageReport = lines.some(l => l.belowReorderPoint);
            batch.set(docRef('staffActivityStats', userDocId(submittedBy.email)), {
              displayName: submittedBy.name, email: submittedBy.email,
              checkInCount: increment(1),
              shortageReportCount: increment(hasShortageReport ? 1 : 0),
              lastActivityAt: ts,
            }, { merge: true });
          }
          for (const line of lines) {
            batch.set(docRef('stockLevels', stockDocId(location.id, line.itemId)), {
              locationId: location.id, itemId: line.itemId,
              currentCount: line.newCount, belowReorderPoint: line.belowReorderPoint,
              requestedLots: line.requestedLots ?? 0,
              lastCheckedAt: ts, lastCheckedBy: submittedBy, lastCheckMode: mode,
            }, { merge: true });
          }
          batch.update(docRef('locations', location.id), {
            lastCheckedAt: ts, lastCheckedBy: submittedBy, updatedAt: ts,
          });
          await batch.commit();

          onSubmitted();
        } catch (e) {
          showAlert('保存に失敗しました。通信状態をご確認のうえ、もう一度お試しください。\n' + (e && e.message ? e.message : ''));
        } finally {
          setSubmitting(false);
        }
      };

      const lowCount = Object.values(tapCounts).filter(c => c > 0).length;

      return (
        <div className="max-w-xl mx-auto pb-24">
          <div className="sticky top-0 bg-[#f9f9f9]/95 backdrop-blur-sm z-10 px-4 py-3 border-b border-gray-200 flex items-center gap-2">
            <button onClick={onBack} className="text-gray-400 hover:text-gray-700 text-xs">← 拠点選択に戻る</button>
          </div>
          <div className="px-4 pt-4 pb-2">
            <h2 className="font-serif tracking-wide text-base text-gray-800">{location.name}</h2>
            <p className="text-[10px] text-gray-400 tracking-widest uppercase mt-1">
              {isWithdrawal ? '予備在庫の持ち出し・棚卸' : '発注が必要な品目をタップしてください'}
            </p>
          </div>

          {!isWithdrawal && (
            <div className="px-4 py-2">
              <button
                onClick={() => showConfirm('この拠点は全品目「在庫OK」として記録します。よろしいですか？', () => submit(true), '在庫OKで記録')}
                disabled={submitting || !isRegistered}
                className="w-full flex items-center justify-center gap-2 bg-white border border-gray-300 text-gray-700 hover:bg-gray-100 transition-colors px-4 py-3 text-xs tracking-widest disabled:opacity-50"
              >
                <CheckIcon className="w-4 h-4" /> この拠点は全品目在庫OK
              </button>
            </div>
          )}

          <div className="bg-white border border-gray-200 mx-4 mt-2">
            {relevantItems.map(item => {
              // 進行中の発注がある品目は、持ち出しモードかどうかに関わらずステータス表示を優先する
              // （持ち出しモード側だけこのチェックを飛ばしていたため、発注中の品目でも数量入力できてしまう
              // 不整合があった。常にここで先に判定する）。
              const inProgress = orderByItemId[item.id];
              if (inProgress) {
                const { order, line } = inProgress;
                return (
                  <div key={item.id} className={`flex items-center justify-between py-3.5 px-3 border-b border-gray-100 last:border-b-0 ${STATUS_ROW_BG_CLS[order.status] || ''}`}>
                    <div className="min-w-0 pr-3">
                      <div className="text-sm text-gray-800">{item.name}</div>
                      <div className="text-[10px] text-gray-400 tracking-wide mt-0.5">
                        発注 ×{line.requestedLots ?? 1}{item.orderUnit || ''}
                        {order.status === '依頼送信済み' && order.requestedAt ? `／発注日 ${order.requestedAt.slice(0, 10)}` : ''}
                        {order.status === '配達待ち' && order.deliveryScheduledDate ? `／鴨江到着予定 ${order.deliveryScheduledDate}` : ''}
                        {order.status === '配達待ち' && order.deliveryVisitDate ? `／運搬・配置予定 ${order.deliveryVisitDate}` : ''}
                        {order.status === '配達待ち' && order.deliveryAssignee ? `／配達担当 ${order.deliveryAssignee.name}` : ''}
                      </div>
                    </div>
                    <span className={`text-[11px] tracking-widest px-3 py-1.5 shrink-0 ${STATUS_BADGE_CLS[order.status] || 'bg-gray-100 text-gray-500'}`}>
                      {order.status === '依頼送信済み' ? '発注済み' : order.status}
                    </span>
                  </div>
                );
              }
              if (isWithdrawal) {
                const level = stockLevels[stockDocId(location.id, item.id)];
                const prevCount = level ? level.currentCount : (item.fullStockQty ?? null);
                return (
                  <div key={item.id} className="flex items-center justify-between py-3 px-3 border-b border-gray-100 last:border-b-0">
                    <div className="flex-1 min-w-0 pr-3">
                      <div className="text-sm text-gray-800">{item.name}</div>
                      <div className="text-[10px] text-gray-400 tracking-wide mt-0.5">事務所在庫: {prevCount ?? '未確認'}{item.stockUnit}</div>
                    </div>
                    <Stepper value={withdrawValues[item.id]} onChange={(v) => setWithdrawValue(item.id, v)} unit={item.stockUnit} />
                  </div>
                );
              }
              // ADVが「発注が必要」とタップして送信済みだが、管理者がまだ発注管理画面で
              // 依頼文を作成していない（ordersドキュメント未作成）段階。この間もタップし直せて
              // しまうと重複申告になるため、「依頼中」として表示しタップ操作を無効化する。
              const pendingLevel = stockLevels[stockDocId(location.id, item.id)];
              if (pendingLevel && pendingLevel.belowReorderPoint) {
                return (
                  <div key={item.id} className="flex items-center justify-between py-3.5 px-3 border-b border-gray-100 last:border-b-0 bg-amber-50">
                    <div className="min-w-0 pr-3">
                      <div className="text-sm text-gray-800">{item.name}</div>
                      <div className="text-[10px] text-gray-400 tracking-wide mt-0.5">
                        発注 ×{pendingLevel.requestedLots ?? 1}{item.orderUnit || ''}
                      </div>
                    </div>
                    <span className="text-[11px] tracking-widest px-3 py-1.5 shrink-0 bg-amber-100 text-amber-700">報告済み</span>
                  </div>
                );
              }
              const count = tapCounts[item.id] ?? 0;
              return (
                <React.Fragment key={item.id}>
                  <TapRow item={item} count={count} onTap={() => tapItem(item)} onReset={() => resetItem(item.id)}>
                    <button onClick={() => toggleDetailOpen(item.id, item)} className="text-[10px] text-gray-400 underline shrink-0">
                      {detailOpen[item.id] ? '詳細入力を閉じる' : '正確な残数を入力（任意）'}
                    </button>
                  </TapRow>
                  {count > 0 && detailOpen[item.id] && (
                    <div className="bg-white px-3 pb-3 border-b border-gray-100 last:border-b-0">
                      <Stepper value={detailValues[item.id]} onChange={(v) => setDetailValue(item.id, v)} unit={item.stockUnit} />
                    </div>
                  )}
                </React.Fragment>
              );
            })}
            {relevantItems.length === 0 && <p className="text-center text-xs text-gray-400 py-10">この拠点に紐づく備品がありません</p>}
          </div>

          <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-3 z-10">
            <div className="max-w-xl mx-auto">
              <button
                onClick={() => submit(false)}
                disabled={submitting || !isRegistered}
                className="w-full bg-gray-800 text-white hover:bg-gray-900 transition-colors px-6 py-3 text-xs tracking-widest shadow-sm disabled:opacity-50"
              >{submitting ? '送信中...' : !isRegistered ? '未登録のため送信できません' : (isWithdrawal ? 'この内容で記録する' : (lowCount > 0 ? `この内容で送信する（発注 ${lowCount}件）` : 'この内容で送信する'))}</button>
            </div>
          </div>
        </div>
      );
    };

    const StockCheckView = (props) => {
      const [selected, setSelected] = useState(null);
      if (selected) {
        return (
          <StockCheckForm
            {...props}
            location={selected}
            onBack={() => setSelected(null)}
            onSubmitted={() => { props.showAlert('記録しました。ありがとうございます。'); setSelected(null); }}
          />
        );
      }
      return <LocationPicker locations={props.locations} staleCheckDays={props.staleCheckDays} onSelect={setSelected} />;
    };

    // ============================================================
    // 配置報告（ADV向け：配達待ちの発注を「配置しました」で完了させる）
    // ============================================================
    // 配達待ちの発注のうち、配置できなかった品目を選ぶモーダル。
    // pendingItems は「まだ配置できていない品目」のみ（前回の忘れました報告で
    // 既に配置済みとされた品目は表示・選択の対象から外す）。
    const MissedItemsModal = ({ order, pendingItems, onClose, onConfirm, saving }) => {
      const [selected, setSelected] = useState({});
      const toggle = (itemId) => setSelected(prev => ({ ...prev, [itemId]: !prev[itemId] }));
      const selectedIds = Object.keys(selected).filter(id => selected[id]);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
          <div className="bg-white max-w-sm w-full p-6 shadow-xl border border-gray-200">
            <h3 className="font-serif tracking-wide text-sm text-gray-800 mb-1">{order.locationName}</h3>
            <p className="text-[10px] text-rose-500 tracking-widest uppercase mb-4">配置できなかった品目を選択してください</p>
            <div className="space-y-2 mb-4">
              {pendingItems.map(i => (
                <label key={i.itemId} className="flex items-center gap-2 text-sm text-gray-700">
                  <input type="checkbox" checked={!!selected[i.itemId]} onChange={() => toggle(i.itemId)} />
                  {i.itemName}×{i.requestedLots ?? 1}{i.orderUnit || ''}
                </label>
              ))}
            </div>
            <p className="text-[10px] text-gray-400 mb-4">選択した品目以外は配置済みとして記録されます。</p>
            <div className="flex justify-end gap-2">
              <button onClick={onClose} className="px-4 py-2 text-xs tracking-widest border border-gray-300 text-gray-600 hover:bg-gray-100">キャンセル</button>
              <button
                onClick={() => onConfirm(selectedIds)}
                disabled={selectedIds.length === 0 || saving}
                className="px-4 py-2 text-xs tracking-widest bg-rose-500 text-white hover:bg-rose-600 disabled:opacity-50"
              >{saving ? '記録中...' : 'この内容で記録する'}</button>
            </div>
          </div>
        </div>
      );
    };

    const DeliveryReportView = ({ orders: allOrders, user, isRegistered, showAlert, showConfirm }) => {
      const [submittingId, setSubmittingId] = useState(null);
      const [missedModalOrder, setMissedModalOrder] = useState(null);
      const orders = (allOrders || []).filter(o => o.status === '配達待ち');
      const pendingOrders = (allOrders || []).filter(o => o.status === '依頼送信済み');

      // missedItemIds: 直近の「忘れました」報告で配置できなかった品目。次にこの拠点へ行く人へ
      // 自動でChatwork通知するロジックはPhase2（カレンダー連携）で実装予定。ここでは記録のみ行う。
      const reportDelivered = async (order, missedItemIds = []) => {
        setSubmittingId(order.id);
        try {
          const ts = nowIso();
          const actor = { uid: user.uid, name: user.displayName || user.email };
          // pendingItemIds：今回の報告対象＝まだ配置できていない品目（前回の忘れました報告が
          // あればその品目のみ、なければ全品目）。これ以外の品目は既に配置済みなので触らない。
          const pendingItemIds = (order.missedItemIds && order.missedItemIds.length > 0)
            ? order.missedItemIds
            : order.items.map(i => i.itemId);
          const deliveredItems = order.items.filter(i => pendingItemIds.includes(i.itemId) && !missedItemIds.includes(i.itemId));
          const allDelivered = missedItemIds.length === 0;

          const patch = { updatedAt: ts };
          if (allDelivered) {
            patch.status = '配達済み';
            patch.deliveredAt = ts;
            patch.deliveredBy = actor;
            patch.missedAt = null;
            patch.missedItemIds = [];
          } else {
            patch.missedAt = ts;
            patch.missedBy = actor;
            patch.missedItemIds = missedItemIds;
          }

          // 発注ステータス更新・在庫確認ログ・在庫現在値・拠点の最終確認日時を1つのバッチにまとめ、
          // 途中で失敗して一部だけ反映される不整合を防ぐ。
          const batch = writeBatch(db);
          batch.update(docRef('orders', order.id), patch);
          if (deliveredItems.length > 0) {
            const lines = deliveredItems.map(i => ({
              itemId: i.itemId, itemName: i.itemName, unit: i.stockUnit,
              previousCount: null, newCount: i.fullStockQty ?? i.reorderPoint ?? null, delta: null, belowReorderPoint: false,
            }));
            batch.set(doc(col('stockCheckSessions')), {
              locationId: order.locationId, locationName: order.locationName, mode: 'restock',
              allUnchanged: false, submittedBy: actor, submittedAt: ts,
              linkedOrderId: order.id, lines, memo: allDelivered ? '発注品の配置完了報告' : '発注品の一部配置完了報告',
            });
            for (const line of lines) {
              batch.set(docRef('stockLevels', stockDocId(order.locationId, line.itemId)), {
                locationId: order.locationId, itemId: line.itemId,
                currentCount: line.newCount, belowReorderPoint: false,
                lastCheckedAt: ts, lastCheckedBy: actor, lastCheckMode: 'restock',
              }, { merge: true });
            }
          }
          batch.update(docRef('locations', order.locationId), { lastCheckedAt: ts, lastCheckedBy: actor, updatedAt: ts });
          await batch.commit();

          showAlert(allDelivered ? '配置完了を記録しました。ありがとうございます。' : '未配置の品目を記録しました。次にこの拠点へ行く方への連絡は、現状は藤田さん・染矢さんへ別途ご連絡ください（自動通知はPhase2で対応予定です）。');
        } catch (e) {
          showAlert('記録に失敗しました。\n' + (e && e.message ? e.message : ''));
        } finally {
          setSubmittingId(null);
          setMissedModalOrder(null);
        }
      };

      return (
        <div className="max-w-xl mx-auto space-y-6">
          <section>
            <SectionLabel>配達待ちの発注（{orders.length}件）</SectionLabel>
            <div className="bg-white border border-gray-200 mx-4 divide-y divide-gray-100">
              {orders.length === 0 && <p className="px-4 py-10 text-center text-xs text-gray-400">現在、配置待ちの発注はありません</p>}
              {orders.map(o => {
                const hasMissed = o.missedItemIds && o.missedItemIds.length > 0;
                const isMine = !!(o.deliveryAssignee && o.deliveryAssignee.email && o.deliveryAssignee.email.toLowerCase() === (user.email || '').toLowerCase());
                return (
                  <div key={o.id} className={`px-4 py-4 ${isMine ? 'bg-indigo-50 border-l-4 border-indigo-500' : ''}`}>
                    <div className="flex items-center gap-2">
                      <div className="text-sm text-gray-800">{o.locationName}</div>
                      {isMine && <span className="text-[9px] tracking-widest bg-indigo-600 text-white px-1.5 py-0.5 shrink-0">あなた宛</span>}
                    </div>
                    <div className="text-[10px] text-gray-400 mt-0.5">{o.items.map(i => `${i.itemName}×${i.requestedLots ?? 1}${i.orderUnit || ''}`).join('、')}</div>
                    {o.deliveryAssignee && (
                      <div className={`text-[10px] mt-0.5 ${isMine ? 'text-indigo-700 font-medium' : 'text-gray-400'}`}>
                        配達担当：{o.deliveryAssignee.name}{isMine ? '（あなたです）' : ''}
                      </div>
                    )}
                    {o.deliveryVisitDate && (
                      <div className={`text-[10px] mt-0.5 ${isMine ? 'text-indigo-700 font-medium' : 'text-gray-400'}`}>
                        運搬・配置予定：{o.deliveryVisitDate}
                      </div>
                    )}
                    {o.deliveryScheduledDate && <div className="text-[10px] text-gray-400 mt-0.5">鴨江到着予定：{o.deliveryScheduledDate}</div>}
                    {hasMissed && (
                      <div className="text-[10px] text-rose-500 mt-0.5">
                        未配置：{o.items.filter(i => o.missedItemIds.includes(i.itemId)).map(i => i.itemName).join('、')}（次の訪問時にお願いします）
                      </div>
                    )}
                    <div className="flex gap-2 mt-2">
                      <button
                        onClick={() => showConfirm(`${o.locationName}へ備品をすべて配置しましたか？`, () => reportDelivered(o, []), '配置しました')}
                        disabled={submittingId === o.id || !isRegistered}
                        className="flex-1 bg-gray-800 text-white hover:bg-gray-900 transition-colors px-4 py-2.5 text-xs tracking-widest disabled:opacity-50"
                      >{submittingId === o.id ? '記録中...' : '配置しました'}</button>
                      <button
                        onClick={() => setMissedModalOrder(o)}
                        disabled={submittingId === o.id || !isRegistered}
                        className="flex-1 border border-gray-300 text-gray-600 hover:bg-gray-100 transition-colors px-4 py-2.5 text-xs tracking-widest disabled:opacity-50"
                      >忘れました</button>
                    </div>
                  </div>
                );
              })}
            </div>
          </section>

          {missedModalOrder && (
            <MissedItemsModal
              order={missedModalOrder}
              pendingItems={
                (missedModalOrder.missedItemIds && missedModalOrder.missedItemIds.length > 0)
                  ? missedModalOrder.items.filter(i => missedModalOrder.missedItemIds.includes(i.itemId))
                  : missedModalOrder.items
              }
              saving={submittingId === missedModalOrder.id}
              onClose={() => setMissedModalOrder(null)}
              onConfirm={(missedItemIds) => reportDelivered(missedModalOrder, missedItemIds)}
            />
          )}

          <section>
            <SectionLabel>発注済み（{pendingOrders.length}件）</SectionLabel>
            <div className="bg-white border border-gray-200 mx-4 divide-y divide-gray-100">
              {pendingOrders.length === 0 && <p className="px-4 py-6 text-center text-xs text-gray-400">現在、返答待ちの発注はありません</p>}
              {pendingOrders.map(o => (
                <div key={o.id} className="px-4 py-3">
                  <div className="text-sm text-gray-800">{o.locationName}｜{o.orderRole}</div>
                  <div className="text-[10px] text-gray-400 mt-0.5">{o.items.map(i => `${i.itemName}×${i.requestedLots ?? 1}${i.orderUnit || ''}`).join('、')}</div>
                  <div className="text-[10px] text-amber-600 mt-0.5">
                    発注依頼済み（{o.requestedAt ? o.requestedAt.slice(0, 10) : '日付不明'}）・鴨江到着日の連絡待ちです
                  </div>
                </div>
              ))}
            </div>
          </section>
        </div>
      );
    };

    // guidesコレクションの購読は閲覧画面・設定画面の両方で必要なため、共通フックにまとめる
    // （同じonSnapshotロジックが2箇所に重複していたのを解消）。
    function useGuides() {
      const [guides, setGuides] = useState([]);
      useEffect(() => {
        const unsub = onSnapshot(col('guides'), (snap) => {
          setGuides(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)));
        });
        return () => unsub();
      }, []);
      return guides;
    }

    // ============================================================
    // 手順・印刷方法ページ（閲覧）
    // ============================================================
    const GuidesView = () => {
      const guides = useGuides();
      const [openId, setOpenId] = useState(null);

      return (
        <div className="max-w-xl mx-auto px-4 space-y-2">
          {guides.length === 0 && <p className="text-center text-xs text-gray-400 py-10">手順ページはまだ登録されていません（設定から追加してください）</p>}
          {guides.map(g => (
            <div key={g.id} className="bg-white border border-gray-200">
              <button
                onClick={() => setOpenId(openId === g.id ? null : g.id)}
                className="w-full flex items-center justify-between px-4 py-3 text-left"
              >
                <span className="text-sm text-gray-800">{g.title}</span>
                <ChevronDownIcon className={`w-4 h-4 text-gray-400 transition-transform ${openId === g.id ? 'rotate-180' : ''}`} />
              </button>
              {openId === g.id && (
                <div className="px-4 pb-4 border-t border-gray-100 pt-3">
                  <p className="text-sm text-gray-600 whitespace-pre-wrap leading-relaxed">{g.bodyText}</p>
                  {(g.imageUrls || []).map((url, i) => (
                    <img key={i} src={url} alt="" className="mt-3 max-w-full border border-gray-200" />
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
      );
    };

    // ============================================================
    // 設定（管理者向け）：拠点 / 備品テンプレート / 手順ページ / 全般
    // ============================================================
    const FormField = ({ label, children }) => (
      <label className="block mb-3">
        <span className="block text-[10px] text-gray-400 tracking-widest uppercase mb-1">{label}</span>
        {children}
      </label>
    );
    const inputCls = "w-full border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-gray-500";

    const LocationEditModal = ({ location, onClose, showAlert }) => {
      const isNew = !location;
      const [name, setName] = useState(location?.name || '');
      const [type, setType] = useState(location?.type || 'model_house');
      const [keywordsText, setKeywordsText] = useState((location?.keywords || []).join(', '));
      const [saving, setSaving] = useState(false);

      const save = async () => {
        if (!name.trim()) { showAlert('拠点名を入力してください。'); return; }
        setSaving(true);
        try {
          const keywords = keywordsText.split(',').map(s => s.trim()).filter(Boolean);
          const ts = nowIso();
          if (isNew) {
            const id = 'loc-' + Date.now();
            await setDoc(docRef('locations', id), { id, name, type, keywords, isActive: true, order: 999, lastCheckedAt: null, lastCheckedBy: null, createdAt: ts, updatedAt: ts });
          } else {
            await updateDoc(docRef('locations', location.id), { name, type, keywords, updatedAt: ts });
          }
          onClose();
        } catch (e) {
          showAlert('保存に失敗しました。\n' + (e && e.message ? e.message : ''));
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
          <div className="bg-white max-w-md w-full p-6 shadow-xl border border-gray-200">
            <h3 className="font-serif tracking-wide text-sm text-gray-800 mb-4">{isNew ? '拠点を追加' : '拠点を編集'}</h3>
            <FormField label="拠点名"><input className={inputCls} value={name} onChange={e => setName(e.target.value)} /></FormField>
            <FormField label="種別">
              <select className={inputCls} value={type} onChange={e => setType(e.target.value)}>
                <option value="model_house">常設モデルハウス</option>
                <option value="completion_viewing">完成見学会</option>
                <option value="office_reserve">事務所予備在庫</option>
              </select>
            </FormField>
            <FormField label="カレンダー識別キーワード（カンマ区切り、複数可）">
              <input className={inputCls} value={keywordsText} onChange={e => setKeywordsText(e.target.value)} placeholder="例：森下, 内野" />
            </FormField>
            <div className="flex justify-end gap-2 mt-4">
              <button onClick={onClose} className="px-4 py-2 text-xs tracking-widest border border-gray-300 text-gray-600 hover:bg-gray-100">キャンセル</button>
              <button onClick={save} disabled={saving} className="px-4 py-2 text-xs tracking-widest bg-gray-800 text-white hover:bg-gray-900 disabled:opacity-50">{saving ? '保存中...' : '保存'}</button>
            </div>
          </div>
        </div>
      );
    };

    const StaffEditModal = ({ staff, onClose, showAlert }) => {
      const isNew = !staff;
      const [displayName, setDisplayName] = useState(staff?.displayName || '');
      const [email, setEmail] = useState(staff?.email || '');
      const [role, setRole] = useState(staff?.role || 'adv');
      const [chatworkContactId, setChatworkContactId] = useState(staff?.chatworkContactId || '');
      const [saving, setSaving] = useState(false);

      const save = async () => {
        if (!displayName.trim()) { showAlert('名前を入力してください。'); return; }
        if (!email.trim() || !email.includes('@')) { showAlert('正しいメールアドレスを入力してください。'); return; }
        setSaving(true);
        try {
          const ts = nowIso();
          const id = userDocId(isNew ? email : staff.email);
          await setDoc(docRef('users', id), {
            displayName: displayName.trim(), email: email.trim(), role,
            chatworkContactId: chatworkContactId.trim(),
            updatedAt: ts,
          }, { merge: true });
          onClose();
        } catch (e) {
          showAlert('保存に失敗しました。\n' + (e && e.message ? e.message : ''));
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
          <div className="bg-white max-w-md w-full p-6 shadow-xl border border-gray-200">
            <h3 className="font-serif tracking-wide text-sm text-gray-800 mb-4">{isNew ? 'スタッフを追加' : 'スタッフを編集'}</h3>
            <FormField label="名前"><input className={inputCls} value={displayName} onChange={e => setDisplayName(e.target.value)} /></FormField>
            <FormField label="メールアドレス">
              <input className={inputCls} value={email} onChange={e => setEmail(e.target.value)} disabled={!isNew} placeholder="example@hakuto-k.jp" />
              {!isNew && <p className="text-[10px] text-gray-400 mt-1">メールアドレスは登録後変更できません（削除して登録し直してください）</p>}
            </FormField>
            <FormField label="権限">
              <select className={inputCls} value={role} onChange={e => setRole(e.target.value)}>
                <option value="adv">ADV（一般）</option>
                <option value="admin">管理者</option>
              </select>
            </FormField>
            <FormField label="ChatworkアカウントID（任意・配達依頼等のTO通知に使用）">
              <input className={inputCls} value={chatworkContactId} onChange={e => setChatworkContactId(e.target.value)} placeholder="例：1234567" />
            </FormField>
            <div className="flex justify-end gap-2 mt-4">
              <button onClick={onClose} className="px-4 py-2 text-xs tracking-widest border border-gray-300 text-gray-600 hover:bg-gray-100">キャンセル</button>
              <button onClick={save} disabled={saving} className="px-4 py-2 text-xs tracking-widest bg-gray-800 text-white hover:bg-gray-900 disabled:opacity-50">{saving ? '保存中...' : '保存'}</button>
            </div>
          </div>
        </div>
      );
    };

    // 自分のChatwork個人APIトークンを登録する自己申告カード。
    //
    // 保護は二重になっている：
    // 1. 画面レベル：このカードは管理者（isAdmin）にしか表示しない（下のガード節）。
    //    さらに、この画面自体（設定タブ）は App.jsの renderView 側で isAdmin の人にしか
    //    そもそもルーティングされない（二重に隠れている）。
    // 2. データベースレベル：保存先は artifacts配下の共通データ置き場とは別の、独立した
    //    トップレベルコレクション userSecrets/{自分のメールアドレス}。Firestoreの
    //    セキュリティルール（Firebase Console > Firestore Database > ルール）で、
    //    「リクエストしてきた本人のメールアドレスとドキュメントIDが一致する場合のみ」
    //    読み書きを許可するよう設定済み。つまり管理者であっても、他人のトークンは
    //    ブラウザの開発者ツールで直接Firestoreを叩いても読めない（画面を隠しているだけではない）。
    //    GAS（サーバー側）だけは、サービスアカウント経由の別ルートでこのルールの対象外として
    //    全員分を読み取り、実際の代理送信に使う。
    const MyChatworkTokenCard = ({ user, isAdmin, showAlert }) => {
      const [token, setToken] = useState('');
      const [loaded, setLoaded] = useState(false);
      const [saving, setSaving] = useState(false);
      const myId = userDocId(user.email);

      // Reactのフック規則上、useEffectより後ろにガード節を置く必要があるため、
      // isAdmin===falseの時はuseEffect内で何もしない（実処理は下のreturn nullで止める）。
      useEffect(() => {
        if (!isAdmin) return;
        let cancelled = false;
        getDoc(doc(db, 'userSecrets', myId)).then(snap => {
          if (cancelled) return;
          setToken((snap.exists() && snap.data().chatworkApiToken) || '');
          setLoaded(true);
        }).catch(() => setLoaded(true));
        return () => { cancelled = true; };
      }, [myId, isAdmin]);

      if (!isAdmin) return null; // 画面レベルの保護（呼び出し元が万一admin以外に見せても表示しない）

      const save = async () => {
        setSaving(true);
        try {
          await setDoc(doc(db, 'userSecrets', myId), { email: user.email, chatworkApiToken: token.trim(), updatedAt: nowIso() }, { merge: true });
          showAlert('保存しました。');
        } catch (e) {
          showAlert('保存に失敗しました。\n' + (e && e.message ? e.message : ''));
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="bg-white border border-gray-200 mx-4 p-4 mb-3">
          <p className="text-[10px] text-gray-400 tracking-widest uppercase mb-1">あなたのChatwork APIトークン</p>
          <p className="text-[11px] text-gray-400 mb-2">
            ここに入力した内容は、あなた以外（他の管理者を含む）には見えません。画面を隠しているだけでなく、
            データベース側の設定（Firestoreセキュリティルール）でも「本人のメールアドレスと一致する場合のみ」
            読み書きできるよう制限しているため、他の人が開発者ツール等で直接データを覗いても読み取れません。
            自動送信の処理（GASサーバー）だけは、別の安全な経路でこの内容を使って「連携設定」タブで選ばれた
            代理送信者としてChatworkへ送信します。
          </p>
          {loaded ? (
            <>
              <input type="password" className={inputCls} value={token} onChange={e => setToken(e.target.value)} placeholder="Chatworkの個人APIトークン" />
              <button onClick={save} disabled={saving} className="mt-2 bg-gray-800 text-white hover:bg-gray-900 transition-colors px-4 py-2 text-xs tracking-widest disabled:opacity-50">{saving ? '保存中...' : '保存'}</button>
            </>
          ) : <p className="text-xs text-gray-400">読み込み中...</p>}
        </div>
      );
    };

    const StaffSettingsPanel = ({ staffList, user, isAdmin, showAlert, showConfirm }) => {
      const [editing, setEditing] = useState(undefined); // undefined=閉じている, null=新規, obj=編集

      const myId = userDocId(user.email);
      const remove = async (staff) => {
        // 「自分自身」の判定はメールアドレスの値ではなく、ドキュメントIDで行う。
        // メールアドレスが同じでも、旧方式（ログインID採番）で作られた重複レコードは
        // 別ドキュメントなので、そちらは削除できるようにする（今回の移行で必要になるケース）。
        if (staff.id === myId) {
          showAlert('現在ログイン中の自分自身のレコードは削除できません。');
          return;
        }
        await deleteDoc(docRef('users', staff.id));
      };

      const roleLabel = { admin: '管理者', adv: 'ADV（一般）' };

      return (
        <div>
          <MyChatworkTokenCard user={user} isAdmin={isAdmin} showAlert={showAlert} />
          <div className="flex justify-end px-4 mb-2">
            <button onClick={() => setEditing(null)} className="flex items-center gap-1 text-[11px] tracking-widest bg-gray-800 text-white hover:bg-gray-900 px-3 py-1.5">
              <PlusIcon className="w-3.5 h-3.5" />スタッフを追加
            </button>
          </div>
          <div className="bg-white border border-gray-200 mx-4 divide-y divide-gray-100">
            {staffList.length === 0 && <p className="px-4 py-6 text-center text-xs text-gray-400">スタッフはまだ登録されていません</p>}
            {staffList.map(s => (
              <div key={s.id} className="flex items-center justify-between px-4 py-3">

    // GASから返るサマリーオブジェクトを、人が読める日本語の1〜数行に整形する。
    // 「まだ返信が来ていない」のような“何も起きなかった”状態も、エラーと区別して分かるようにする。
    function formatBatchStepResult(step, result) {
      if (!result) return '実行しました（結果の詳細は取得できませんでした）。';
      if (result.error) return 'エラー：' + result.error;
      if (result.skipped) return 'スキップしました：' + (result.reason || '');
      switch (step) {
        case 'autoSendOrderRequests': {
          if (result.sentGroups === 0) return result.message || '対象となる発注点割れの品目はありませんでした。';
          let t = `${result.sentGroups}件のまとめ発注（合計${result.locations}拠点分）をChatworkへ送信しました。`;
          if (result.skippedNoRoom && result.skippedNoRoom.length) t += `\n送信先ルーム未設定でスキップ：${result.skippedNoRoom.join('、')}`;
          return t;
        }
        case 'checkChatworkReplies': {
          if (result.openOrders === 0) return result.message || '到着日の返答待ちの発注がありませんでした。';
          if (result.messagesChecked === 0) return result.message || '新着メッセージはありませんでした（まだ返信が来ていない可能性があります）。';
          const byReply = result.matchedByReply ? `うちRe返信で判定：${result.matchedByReply}件／` : '';
          return `新着メッセージ${result.messagesChecked}件を確認し、${result.matched}件を「配達待ち」に反映しました（${byReply}要確認：${result.needsReview}件／対象外：${result.other}件）。`;
        }
        case 'assignDeliveries': {
          if (result.candidateOrders === 0) return result.message || '到着日確定済みで担当者未設定の発注はありませんでした。';
          let t2 = `候補${result.candidateOrders}件のうち${result.assigned}件の配達担当を自動割当しました。`;
          if (result.skippedReasons && result.skippedReasons.length) t2 += `\n保留（${result.skipped}件）：\n・` + result.skippedReasons.join('\n・');
          return t2;
        }
        case 'checkStaleLocations':
          return `未確認候補${result.staleCandidates}件のうち${result.notified}件に通知しました。`;
        case 'cleanupOldLogs': {
          if (result.deleted === 0) return '削除対象の古いログはありませんでした。';
          const parts = Object.entries(result.byCollection || {}).filter(([, n]) => n > 0).map(([c, n]) => `${c}：${n}件`);
          return `古いログを${result.deleted}件削除しました（${parts.join('／')}）。`;
        }
        default:
          return JSON.stringify(result);
      }
    }

    const BatchRunView = ({ config, user, showAlert }) => {
      const [runningStep, setRunningStep] = useState(null);
      const [lastResults, setLastResults] = useState([]); // [{step,label,text}]

      // 定時（9/12/17時）を待たずに、バッチ処理を今すぐ実行する（管理者専用）。
      // 実際にChatworkへメッセージが送られる可能性があるため、GAS側でも承認者メールの
      // ホワイトリストを二重チェックしている。
      const runBatchStep = async (step, label) => {
        if (!config.gasWebAppUrl || !config.gasSharedToken) {
          showAlert('設定画面（全般）でGAS WebアプリURLと合言葉を設定してください。');
          return;
        }
        setRunningStep(step);
        try {
          const res = await fetch(config.gasWebAppUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'runBatchStep', token: config.gasSharedToken, step, approverEmail: user.email }),
          });
          const json = await res.json();
          if (!json.ok) throw new Error(json.error || '不明なエラー');

          const ts = new Date().toLocaleTimeString('ja-JP');
          if (step === 'all' && json.result && json.result.result) {
            const all = json.result.result;
            const entries = BATCH_STEPS.map(s => ({
              step: s.key, label: s.label, at: ts, text: formatBatchStepResult(s.key, all[s.key]),
            }));
            setLastResults(entries);
          } else {
            setLastResults([{ step, label, at: ts, text: formatBatchStepResult(step, json.result && json.result.result) }]);
          }
        } catch (e) {
          showAlert('実行に失敗しました。\n' + (e && e.message ? e.message : ''));
        } finally {
          setRunningStep(null);
        }
      };

      return (
        <div className="max-w-xl mx-auto space-y-4">
          <section>
            <SectionLabel>バッチ処理の手動実行（管理者専用）</SectionLabel>
            <div className="bg-white border border-gray-200 mx-4 p-4">

              <div className="flex flex-col gap-2">
                {BATCH_STEPS.map(s => (
                  <button
                    key={s.key} onClick={() => runBatchStep(s.key, s.label)} disabled={!!runningStep}
                    className="text-left text-xs tracking-wide border border-gray-300 text-gray-700 hover:bg-gray-100 px-3 py-2.5 disabled:opacity-50"
                  >{runningStep === s.key ? '実行中...' : s.label}</button>
                ))}
                <button
                  onClick={() => runBatchStep('all', 'すべて実行')} disabled={!!runningStep}
                  className="text-xs tracking-widest bg-indigo-700 text-white hover:bg-indigo-800 px-3 py-2.5 disabled:opacity-50"
                >{runningStep === 'all' ? '実行中...' : 'すべて実行（1日3回のバッチと同じ内容）'}</button>
              </div>
            </div>
          </section>

          {lastResults.length > 0 && (
            <section>
              <SectionLabel>実行結果</SectionLabel>
              <div className="bg-white border border-gray-200 mx-4 divide-y divide-gray-100">
                {lastResults.map((r, idx) => (

                    <p className="text-[11px] text-gray-500 mt-1 whitespace-pre-line">{r.text}</p>
                  </div>
                ))}
              </div>
            </section>

      // 拠点別・品目別の発注頻度（＝減りやすさ）は、発注記録（orders）全期間から集計する。

      const locationOrderRanking = useMemo(() => {
        const counts = {};

        return Object.entries(counts).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value).slice(0, 8);

      const itemOrderRanking = useMemo(() => {
