              ))}
            </div>
            <p className="text-[10px] text-gray-300 text-center mt-2">この一覧は直近35日分のみです（それより古い個別記録は自動削除されますが、上の統計の数値自体は消えずに残ります）。</p>
          </section>
        </div>
      );
    };

    // ============================================================
    // 発注管理（管理者向け）
    // ============================================================
    // group.locationGroups は同じ発注担当区分（業務管理／集客・マーケ）の中で、対象拠点ごとの
    // 品目リストをまとめたもの。マーケと業務管理は宛先が違うので引き続き別文章にするが、
    // 同じ担当区分であれば複数のモデルハウス・見学会をまとめて1通の文章にする。
    // テンプレート本文（config.messageTemplates、GAS側 MessageTemplates.gs と共通の情報源）を使う。
    function buildOrderRequestText(role, locationGroups, config) {
      const sections = locationGroups.map(g => {
        const itemLines = g.lines.map(l => {
          const orderUnit = l.item.orderUnit || l.item.stockUnit || '';
          const label = l.item.orderUnitLabel ? `（${l.item.orderUnitLabel}）` : '';
          // GAS側（AutoOrderRequest.gs buildOrderRequestTextGas_）と演算子を完全に一致させること
          return `・${l.itemName}：${l.requestedLots || 1}${orderUnit}${label}`;
        }).join('\n');
        return `▼${g.location.name}\n${itemLines}`;
      }).join('\n\n');

      const key = role === '業務管理' ? 'orderRequestOperations'
        : role === '集客・マーケ' ? 'orderRequestMarketing' : 'orderRequestAdvSelf';
      return renderTemplate(messageTemplateOf(config, key), { sections });
    }

    const OrderDraftModal = ({ group, config, onClose, onConfirmed, showAlert, user }) => {
      const [text, setText] = useState(buildOrderRequestText(group.role, group.locationGroups, config));
      const [saving, setSaving] = useState(false);
      const [autoSending, setAutoSending] = useState(false);
      const textareaRef = useRef(null);

      const copyText = async () => {
        try {
          await navigator.clipboard.writeText(text);
          showAlert('依頼文をコピーしました。Chatworkに貼り付けて送信してください。');
        } catch (e) {
          textareaRef.current && textareaRef.current.select();
        }
      };

      // モーダルを開いてから送信するまでの間（文面を確認・編集している数十秒〜数分）に、
      // GAS側の自動処理（1日3回のバッチ、または手動実行）が同じ拠点・品目の発注を
      // 先に作ってしまっていないか、送信の直前にもう一度確認する（二重発注の防止）。
      // これにより危険な時間帯は「本当に同じ一瞬」まで縮まる（完全にゼロにはできないが、
      // 実運用上は問題にならないレベルになる）。
      // 何か1件でも既に他の経路で発注済みになっていれば、文面（text）と実際に記録される
      // 品目がずれてしまうため、部分的に送るのではなく丸ごと中断する（安全側に倒す）。
      const findAlreadyCoveredItemNames = async () => {
        const snap = await getDocs(col('orders'));
        const covered = new Set();
        snap.docs.forEach(d => {
          const o = d.data();
          if (o.status === '配達済み') return;
          (o.items || []).forEach(i => covered.add(o.locationId + '_' + i.itemId));
        });
        const alreadyCovered = [];
        group.locationGroups.forEach(g => g.lines.forEach(l => {
          if (covered.has(g.location.id + '_' + l.itemId)) alreadyCovered.push(l.itemName);
        }));
        return alreadyCovered;
      };

      // 対象拠点ごとに発注ステータスは個別管理する（到着日・配達担当は拠点ごとに異なるため）。
      // 依頼文（1通にまとめたもの）は各拠点のordersドキュメントに同じ内容を記録しておく。
      // 作成した発注ドキュメントのIDを返す（GAS送信後に、実際のChatworkメッセージIDを
      // 書き戻してもらうために使う。Chatworkで「返信」された時にどの発注宛かを機械的に
      // 判定できるようにするため）。
      const recordOrders = async (chatworkRoomId) => {
        const ts = nowIso();
        const batch = writeBatch(db);
        const refs = group.locationGroups.map(() => doc(col('orders')));
        group.locationGroups.forEach((g, idx) => {
          batch.set(refs[idx], {
            locationId: g.location.id, locationName: g.location.name, orderRole: group.role,
            items: g.lines.map(l => ({
              itemId: l.itemId, itemName: l.itemName, requestedLots: l.requestedLots ?? 1,
              stockUnit: l.item.stockUnit, orderUnit: l.item.orderUnit, orderUnitLabel: l.item.orderUnitLabel || '',
              reorderPoint: l.item.reorderPoint, fullStockQty: l.item.fullStockQty,
            })),
            status: '依頼送信済み', requestDraftText: text,
            requestedAt: ts, requestedBy: { uid: user.uid, name: user.displayName || user.email },
            deliveryScheduledDate: null, deliveryAssignee: null, deliveredAt: null, deliveredBy: null, updatedAt: ts,
            chatworkRoomId: chatworkRoomId || null, chatworkMessageId: null, autoSendStatus: null, needsReview: false,
          });
        });
        await batch.commit();
        return refs.map(r => r.id);
      };

      const markRequested = async () => {
        setSaving(true);
        try {
          const alreadyCovered = await findAlreadyCoveredItemNames();
          if (alreadyCovered.length > 0) {
            showAlert(`一部の品目（${alreadyCovered.join('、')}）は、この画面を開いている間に他の経路（自動処理など）で既に発注されていました。画面を閉じて最新の状態をご確認ください。`);
            onClose();
            return;
          }
          await recordOrders(null);
          onConfirmed();
        } catch (e) {
          showAlert('記録に失敗しました。\n' + (e && e.message ? e.message : ''));
        } finally {
          setSaving(false);
        }
      };

      // GAS経由でChatworkへ自動送信するボタンは常に表示する（ADV本人手配のみ送信先が無いため対象外）。
      // 「完全自動化」チェック（設定画面）がONの場合はGASが1日3回のバッチで自動的に送信するが、
      // その場合もこのボタンで随時・任意のタイミングで手動送信できる（バッチを待たず今すぐ送りたい時用）。
      const roomIdForRole = group.role === '業務管理'
        ? config.chatworkRoomIds?.operations
        : group.role === '集客・マーケ' ? config.chatworkRoomIds?.marketing : null;

      const sendViaGas = async () => {
        if (!config.gasWebAppUrl || !config.gasSharedToken) {
          showAlert('設定画面（全般）でGAS WebアプリURLと合言葉を設定してください。');
          return;
        }
        if (!roomIdForRole) {
          showAlert('設定画面（全般）で送信先のルームIDを設定してください。');
          return;
        }
        setAutoSending(true);
        let createdOrderIds = [];
        try {
          const alreadyCovered = await findAlreadyCoveredItemNames();
          if (alreadyCovered.length > 0) {
            showAlert(`一部の品目（${alreadyCovered.join('、')}）は、この画面を開いている間に他の経路（自動処理など）で既に発注されていました。Chatworkへの送信は行いませんでした。画面を閉じて最新の状態をご確認ください。`);
            onClose();
            return;
          }
          // 先に発注ドキュメントを作ってIDを確定させ、GASにそのIDを渡す。GAS側で実際に
          // Chatworkへ送信できた時点で、それぞれの発注にchatworkMessageIdが書き戻される
          // （後日Chatworkで「返信」された時に、どの発注宛かを機械的に判定できるようにするため）。
          createdOrderIds = await recordOrders(roomIdForRole);
          const res = await fetch(config.gasWebAppUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'sendOrderRequest', token: config.gasSharedToken, roomId: roomIdForRole, body: text, orderIds: createdOrderIds }),
          });
          const json = await res.json();
          if (!json.ok) throw new Error(json.error || '不明なエラー');
          onConfirmed();
        } catch (e) {
          // Chatworkへの送信に失敗した場合、既に作成した発注記録だけが残ると実態と食い違うため
          // 巻き戻す（ベストエフォート。巻き戻し自体が失敗しても元のエラーは表示する）。
          if (createdOrderIds.length > 0) {
            try {
              const rollback = writeBatch(db);
              createdOrderIds.forEach(id => rollback.delete(docRef('orders', id)));
              await rollback.commit();
            } catch (_) { /* ベストエフォートのため無視 */ }
          }
          showAlert('送信に失敗しました。\n' + (e && e.message ? e.message : ''));
        } finally {
          setAutoSending(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
          <div className="bg-white max-w-lg w-full p-6 shadow-xl border border-gray-200 max-h-[85vh] overflow-y-auto">
            <h3 className="font-serif tracking-wide text-sm text-gray-800 mb-1">
              {group.role}｜{group.locationGroups.map(g => g.location.name).join('、')}
            </h3>
            <p className="text-[10px] text-gray-400 tracking-widest uppercase mb-4">発注依頼文（内容確認のうえChatworkへ送信）</p>
            <textarea
              ref={textareaRef}
              value={text}
              onChange={(e) => setText(e.target.value)}
              rows={10}
              className="w-full border border-gray-300 p-3 text-sm leading-relaxed focus:outline-none focus:border-gray-500"
            />
            <div className="flex flex-wrap justify-end gap-2 mt-4">
              <button onClick={onClose} className="px-4 py-2 text-xs tracking-widest border border-gray-300 text-gray-600 hover:bg-gray-100">閉じる</button>
              <button onClick={copyText} className="px-4 py-2 text-xs tracking-widest border border-gray-300 text-gray-600 hover:bg-gray-100">文面をコピー</button>
              {roomIdForRole ? (
                <button onClick={sendViaGas} disabled={autoSending} className="px-4 py-2 text-xs tracking-widest bg-indigo-700 text-white hover:bg-indigo-800 disabled:opacity-50">
                  {autoSending ? '送信中...' : 'Chatworkへ自動送信'}
                </button>
              ) : (
                <button onClick={markRequested} disabled={saving} className="px-4 py-2 text-xs tracking-widest bg-gray-800 text-white hover:bg-gray-900 disabled:opacity-50">
                  {saving ? '記録中...' : '送信済みとして記録する'}
                </button>
              )}
            </div>
          </div>
        </div>
      );
    };

    const ORDER_STATUS_LABELS = ['未発注', '依頼送信済み', '配達待ち', '配達済み'];

    const ORDER_STATUS_DISPLAY = { '依頼送信済み': '発注済み', '配達待ち': '配達待ち', '配達済み': '配達済み' };

    const OrderStatusUpdateRow = ({ order, showAlert }) => {
      const [scheduledDate, setScheduledDate] = useState(order.deliveryScheduledDate || '');
      const [saving, setSaving] = useState(false);

      // 「配達済み」への変更はここでは行わない（配置報告画面の「配置しました／忘れました」からのみ
      // 行う設計に統一した。ここで直接ステータスだけ変更すると在庫データが更新されず、
      // 同じ品目が再び「発注が必要」に浮上する不整合が起きるため）。
      const advance = async (nextStatus) => {
        setSaving(true);
        const ts = nowIso();
        const patch = { status: nextStatus, updatedAt: ts };
        if (nextStatus === '配達待ち') patch.deliveryScheduledDate = scheduledDate || null;
        try {
          await updateDoc(docRef('orders', order.id), patch);
        } catch (e) {
          showAlert('更新に失敗しました。\n' + (e && e.message ? e.message : ''));
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="px-4 py-3 border-b border-gray-100 last:border-b-0">
          <div className="flex items-center justify-between">
            <div>
              <div className="text-sm text-gray-800">{order.locationName}｜{order.orderRole}</div>
              <div className="text-[10px] text-gray-400 mt-0.5">{order.items.map(i => `${i.itemName}×${i.requestedLots ?? 1}${i.orderUnit || ''}`).join('、')}</div>
              <div className="text-[10px] text-gray-400 mt-0.5">
                発注日：{order.requestedAt ? order.requestedAt.slice(0, 10) : '不明'}
                {order.deliveryScheduledDate ? `／鴨江到着予定 ${order.deliveryScheduledDate}` : ''}
              </div>
              <div className="text-[10px] text-gray-400 mt-0.5">
                配達担当：{order.deliveryAssignee ? order.deliveryAssignee.name : '自動設定予定'}
                {order.deliveryVisitDate ? `／運搬・配置予定 ${order.deliveryVisitDate}` : ''}
              </div>
              {order.missedItemIds && order.missedItemIds.length > 0 && (
                <div className="text-[10px] text-rose-500 mt-0.5">
                  未配置あり：{order.items.filter(i => order.missedItemIds.includes(i.itemId)).map(i => i.itemName).join('、')}（要フォロー）
                </div>
              )}
            </div>
            <span className={`text-[10px] tracking-widest uppercase px-2 py-0.5 shrink-0 ${STATUS_BADGE_CLS[order.status] || 'bg-gray-800 text-white'}`}>{ORDER_STATUS_DISPLAY[order.status] || order.status}</span>
          </div>
          <div className="flex flex-wrap items-center gap-2 mt-2">
            {order.status === '依頼送信済み' && (
              <>
                <input
                  type="date" value={scheduledDate} onChange={(e) => setScheduledDate(e.target.value)}
                  className="border border-gray-300 text-xs px-2 py-1"
                />
                <button onClick={() => advance('配達待ち')} disabled={saving} className="text-[11px] tracking-widest border border-gray-300 text-gray-600 hover:bg-gray-100 px-3 py-1 disabled:opacity-50">{saving ? '登録中...' : '鴨江到着予定を登録'}</button>
              </>
            )}
            {order.status === '配達待ち' && (
              <span className="text-[11px] text-gray-400">配達済みへの変更は「配置報告」画面から行ってください</span>
            )}
          </div>
        </div>
      );
    };

    // ============================================================
    // 承認待ちメッセージ（Phase2：GASが作った送信下書きを確認して送信する）
    // ============================================================
    const OUTBOX_KIND_LABEL = {
      order_request: '発注依頼', delivery_request: '運搬依頼',
      adv_shortage_notice: '不足報告通知', stale_alert: '未確認アラート'
    };

    const PendingApprovalView = ({ outbox, config, user, showAlert, showConfirm }) => {
      const [approvingId, setApprovingId] = useState(null);
      const pending = (outbox || []).filter(o => o.status === 'pending_review');
      const sent = (outbox || []).filter(o => o.status === 'sent').slice(0, 10);

      const approve = async (item) => {
        if (!config.gasWebAppUrl || !config.gasSharedToken) {
          showAlert('設定画面（全般）でGAS WebアプリURLと合言葉を設定してください。');
          return;
        }
        setApprovingId(item.id);
        try {
          const res = await fetch(config.gasWebAppUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // application/jsonにするとCORSプリフライトでGASが失敗するため
            body: JSON.stringify({ action: 'approveAndSend', token: config.gasSharedToken, outboxId: item.id, approverEmail: user.email }),
          });
          const json = await res.json();
          if (!json.ok) throw new Error(json.error || '不明なエラー');
          showAlert('送信しました。');
        } catch (e) {
          showAlert('送信に失敗しました。\n' + (e && e.message ? e.message : ''));
        } finally {
          setApprovingId(null);
        }
      };

      return (
        <div className="max-w-2xl mx-auto space-y-6">
          <section>
            <SectionLabel>承認待ち（{pending.length}件）</SectionLabel>
            <div className="bg-white border border-gray-200 mx-4 divide-y divide-gray-100">
              {pending.length === 0 && <p className="px-4 py-6 text-center text-xs text-gray-400">現在、承認待ちのメッセージはありません</p>}
              {pending.map(item => (
                <div key={item.id} className="px-4 py-4">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-[10px] tracking-widest uppercase text-gray-400">{OUTBOX_KIND_LABEL[item.kind] || item.kind}</span>
                    <span className="text-[10px] text-gray-400">{item.draftedAt ? item.draftedAt.slice(0, 16).replace('T', ' ') : ''}</span>
                  </div>
                  <div className="text-sm text-gray-700 whitespace-pre-wrap leading-relaxed bg-gray-50 border border-gray-100 p-3">{item.body}</div>
                  <button
                    onClick={() => showConfirm('この内容でChatworkへ送信しますか？', () => approve(item), '送信する')}
                    disabled={approvingId === item.id}
                    className="mt-2 w-full bg-gray-800 text-white hover:bg-gray-900 transition-colors px-4 py-2.5 text-xs tracking-widest disabled:opacity-50"
                  >{approvingId === item.id ? '送信中...' : '内容を確認して送信する'}</button>
                </div>
              ))}
            </div>
          </section>

          <section>
            <SectionLabel>最近送信済み</SectionLabel>
            <div className="bg-white border border-gray-200 mx-4 divide-y divide-gray-100">
              {sent.length === 0 && <p className="px-4 py-6 text-center text-xs text-gray-400">履歴はまだありません</p>}
              {sent.map(item => (
                <div key={item.id} className="px-4 py-3">
                  <div className="flex items-center justify-between">
                    <span className="text-[10px] tracking-widest uppercase text-gray-400">{OUTBOX_KIND_LABEL[item.kind] || item.kind}</span>
                    <span className="text-[10px] text-gray-400">{item.sentAt ? item.sentAt.slice(0, 16).replace('T', ' ') : ''}</span>
                  </div>
                  <p className="text-xs text-gray-500 mt-1 truncate">{item.body}</p>
                </div>
              ))}
            </div>
          </section>
        </div>
      );
    };

    const OrderManagementView = ({ locations, items, stockLevels, orders, config, user, showAlert }) => {
      const [modalGroup, setModalGroup] = useState(null);

      const itemById = useMemo(() => Object.fromEntries(items.map(i => [i.id, i])), [items]);
      const locationById = useMemo(() => Object.fromEntries(locations.map(l => [l.id, l])), [locations]);

      // 未発注（発注点割れかつ、進行中の発注に含まれていない品目）を拠点×発注担当区分でグルーピング
      const openOrderItemKeys = useMemo(() => {
        const set = new Set();
        orders.filter(o => o.status !== '配達済み').forEach(o => o.items.forEach(i => set.add(o.locationId + '_' + i.itemId)));
        return set;
      }, [orders]);

      // まず拠点×担当区分でまとめ、そのうえで担当区分だけでグルーピングし直す。
      // マーケと業務管理は宛先が違うため引き続き別グループだが、同じ担当区分なら
      // 複数の拠点をまたいで1つの依頼（1通の文章）にまとめられるようにするため。
      const pendingGroups = useMemo(() => {
        const byLocationRole = {};
        Object.values(stockLevels).forEach(s => {
          if (!s.belowReorderPoint) return;
          const item = itemById[s.itemId];
          const location = locationById[s.locationId];
          if (!item || !location || item.orderRole === 'ADV本人手配') return;
          if (openOrderItemKeys.has(s.locationId + '_' + s.itemId)) return;
          const key = s.locationId + '|' + item.orderRole;
          byLocationRole[key] = byLocationRole[key] || { location, role: item.orderRole, lines: [] };
          byLocationRole[key].lines.push({ ...s, item, itemName: item.name, unit: item.stockUnit });
        });

        const byRole = {};
        Object.values(byLocationRole).forEach(g => {
          byRole[g.role] = byRole[g.role] || { role: g.role, locationGroups: [] };
          byRole[g.role].locationGroups.push(g);
        });
        return Object.values(byRole);
      }, [stockLevels, itemById, locationById, openOrderItemKeys]);

      const openOrders = orders.filter(o => o.status !== '配達済み');
      const closedOrders = orders.filter(o => o.status === '配達済み').slice(0, 10);

      return (
        <div className="max-w-2xl mx-auto space-y-6">
          <section>
            <SectionLabel>発注が必要な状態（{pendingGroups.length}件）</SectionLabel>
            <div className="bg-white border border-gray-200 mx-4 divide-y divide-gray-100">
              {pendingGroups.length === 0 && <p className="px-4 py-6 text-center text-xs text-gray-400">現在、新規に発注が必要な品目はありません</p>}
              {pendingGroups.map((g) => (
                <div key={g.role} className="flex items-center justify-between px-4 py-3">
                  <div>
                    <div className="text-sm text-gray-800">{g.role}（{g.locationGroups.length}拠点）</div>
                    {g.locationGroups.map(lg => (
                      <div key={lg.location.id} className="text-[10px] text-gray-400 mt-0.5">
                        {lg.location.name}：{lg.lines.map(l => `${l.itemName}×${l.requestedLots ?? 1}${l.item.orderUnit || ''}`).join('、')}
                      </div>
                    ))}
                  </div>
                  <button onClick={() => setModalGroup(g)} className="text-[11px] tracking-widest bg-gray-800 text-white hover:bg-gray-900 px-3 py-1.5 shrink-0">依頼文を作成</button>
                </div>
              ))}
            </div>
          </section>

          <section>
            <SectionLabel>進行中の発注（{openOrders.length}件）</SectionLabel>
            <div className="bg-white border border-gray-200 mx-4 divide-y divide-gray-100">
              {openOrders.length === 0 && <p className="px-4 py-6 text-center text-xs text-gray-400">進行中の発注はありません</p>}
              {openOrders.map(o => <OrderStatusUpdateRow key={o.id} order={o} showAlert={showAlert} />)}
            </div>
          </section>

          <section>
            <SectionLabel>最近の配達済み</SectionLabel>
            <div className="bg-white border border-gray-200 mx-4 divide-y divide-gray-100">
              {closedOrders.length === 0 && <p className="px-4 py-6 text-center text-xs text-gray-400">履歴はまだありません</p>}
              {closedOrders.map(o => (
                <div key={o.id} className="px-4 py-3 flex items-center justify-between">
                  <div>
                    <div className="text-sm text-gray-600">{o.locationName}｜{o.orderRole}</div>
                    <div className="text-[10px] text-gray-400 mt-0.5">配置：{o.deliveredBy?.name || '不明'}</div>
                  </div>
                  <span className="text-[10px] text-gray-400">{o.deliveredAt ? o.deliveredAt.slice(0, 10) : ''}</span>
                </div>
              ))}
            </div>
          </section>

          {modalGroup && (
            <OrderDraftModal
              group={modalGroup} config={config} user={user} showAlert={showAlert}
              onClose={() => setModalGroup(null)}
              onConfirmed={() => { setModalGroup(null); showAlert('発注依頼を記録しました。'); }}
            />
          )}
        </div>
      );
    };

    // ============================================================
    // App本体
    // ============================================================
    function App() {
      const [user, setUser] = useState(undefined); // undefined=判定中, null=未ログイン
      const [seeding, setSeeding] = useState(false);
      const [view, setView] = useState('stock');
      const [dialog, setDialog] = useState(null);

      const [locations, setLocations] = useState([]);
      const [items, setItems] = useState([]);
      const [stockLevels, setStockLevels] = useState({});
      const [orders, setOrders] = useState([]);
      const [outbox, setOutbox] = useState([]);
      const [staffList, setStaffList] = useState([]);
      const [recentSessions, setRecentSessions] = useState([]);
      const [staffActivityStats, setStaffActivityStats] = useState([]);
      const [config, setConfig] = useState({ staleCheckDays: 14 });
      const [domainError, setDomainError] = useState(false);

      const showAlert = (message) => setDialog({ type: 'alert', message, confirmLabel: 'OK' });
      const showConfirm = (message, onConfirm, confirmLabel) => setDialog({ type: 'confirm', message, onConfirm, confirmLabel });

      useEffect(() => {
        const unsub = onAuthStateChanged(auth, (u) => {
          // hdパラメータはログイン画面での絞り込みヒントに過ぎず強制力がないため、
          // ログイン後にドメインを検証し、社外アカウントなら即サインアウトする。
          if (u && !(u.email || '').toLowerCase().endsWith('@' + ALLOWED_LOGIN_DOMAIN)) {
            setDomainError(true);
            signOut(auth);
            return;
          }
          setDomainError(false);
          setUser(u);
          if (u) {
            // あらかじめ管理者がスタッフ管理画面で登録した人だけが使える運用のため、
            // ここではレコードを新規作成しない（自動登録はしない）。
            // 既に登録済みの人であれば、uid・最終ログイン日時だけ更新する。
            const uref = docRef('users', userDocId(u.email));
            getDoc(uref).then((snap) => {
              if (!snap.exists()) return; // 未登録者：何もしない（閲覧のみで利用してもらう）
              setDoc(uref, { uid: u.uid, lastLoginAt: nowIso() }, { merge: true }).catch(() => {});
            });
          }
        });
        return () => unsub();
      }, []);

      useEffect(() => {
        if (!user) return;
        // 未登録者（users未登録）はFirestoreルール上そもそも書き込みできないため、
        // シード投入は静かに失敗させる（コンソールに未処理rejectionのノイズを出さない）。
        ensureSeedData(setSeeding).catch(() => {});

        const unsubs = [
          onSnapshot(col('locations'), (snap) => setLocations(snap.docs.map(d => ({ id: d.id, ...d.data() })))),
          onSnapshot(col('equipmentItems'), (snap) => setItems(snap.docs.map(d => ({ id: d.id, ...d.data() })))),
          onSnapshot(col('stockLevels'), (snap) => {
            const map = {};
            snap.docs.forEach(d => { map[d.id] = d.data(); });
            setStockLevels(map);
          }),
          onSnapshot(col('orders'), (snap) => {
            setOrders(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.requestedAt || '').localeCompare(a.requestedAt || '')));
          }),
          onSnapshot(col('outbox'), (snap) => {
            setOutbox(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.draftedAt || '').localeCompare(a.draftedAt || '')));
          }),
          // スタッフ管理画面（権限変更）とGAS側の配達担当自動判定の両方で使うため購読する。
          onSnapshot(col('users'), (snap) => {
            setStaffList(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.displayName || '').localeCompare(b.displayName || '', 'ja')));
          }),
          // ダッシュボードの統計（拠点・品目・担当者別の傾向）用。直近35日分だけ読み込む
          // （それより古いものはGAS側の定期クリーンアップで削除される。統計に生の全履歴は不要なため）。
          onSnapshot(
            query(col('stockCheckSessions'), where('submittedAt', '>=', new Date(Date.now() - 35 * 24 * 60 * 60 * 1000).toISOString())),
            (snap) => setRecentSessions(snap.docs.map(d => ({ id: d.id, ...d.data() })))
          ),
          // 担当者別統計の永続カウンター（生ログを35日で削除しても、これは消えずに積み上がる）
          onSnapshot(col('staffActivityStats'), (snap) => setStaffActivityStats(snap.docs.map(d => ({ id: d.id, ...d.data() })))),
          onSnapshot(docRef('system_config', 'default'), (snap) => { if (snap.exists()) setConfig(snap.data()); }),
        ];
        return () => unsubs.forEach(u => u());
      }, [user]);

      if (user === undefined) {
        return <div className="min-h-screen flex items-center justify-center text-gray-300 text-xs">読み込み中...</div>;
      }
      if (!user) {
        return <LoginView domainError={domainError} />;
      }

      // このアプリは「あらかじめ管理者がスタッフ管理画面で登録した人」だけが編集できる運用。
      // isRegistered=falseの人は、画面上は閲覧できるが書き込み操作はすべて無効化する
      // （さらにFirestoreセキュリティルール側でも、未登録者の書き込みはデータベースレベルで拒否している）。
      // 権限（管理者かどうか）はFirestore（users/{email}.role）を見る。ADMIN_EMAILSは、
      // 万一Firestore側のレコードが消えてしまった時に藤田さん・染矢さんが締め出されないための
      // 最終セーフティネットとしてのみ残す（新規スタッフの自動登録には使わない）。
      const myStaffRecord = staffList.find(s => s.id === userDocId(user.email));
      const isRegistered = !!myStaffRecord;
      const isAdmin = myStaffRecord ? myStaffRecord.role === 'admin' : ADMIN_EMAILS.includes((user.email || '').toLowerCase());
      const commonProps = { locations, items, stockLevels, orders, outbox, staffList, recentSessions, staffActivityStats, config, staleCheckDays: config.staleCheckDays ?? 14, user, isAdmin, isRegistered, showAlert, showConfirm };

      const renderView = () => {
        switch (view) {
          case 'stock': return <StockCheckView {...commonProps} />;
          case 'delivery': return <DeliveryReportView {...commonProps} />;
          case 'guides': return <GuidesView />;
          case 'dashboard': return isAdmin ? <DashboardView {...commonProps} /> : null;
          case 'orders': return isAdmin ? <OrderManagementView {...commonProps} /> : null;
          case 'approvals': return isAdmin ? <PendingApprovalView {...commonProps} /> : null;
          case 'batchRun': return isAdmin ? <BatchRunView {...commonProps} /> : null;
          case 'settings': return isAdmin ? <SettingsView {...commonProps} /> : null;
          default: return null;
        }
      };

      return (
        <div className="min-h-screen bg-[#f9f9f9]">
          <Header view={view} setView={setView} isAdmin={isAdmin} onLogout={() => signOut(auth)} userName={user.displayName || user.email} />
          {!isRegistered && (
            <div className="bg-amber-50 border-b border-amber-200 text-amber-800 text-xs text-center py-2 px-4">
              あなたはまだスタッフとして登録されていません。閲覧のみ可能です（入力・送信はできません）。管理者にご連絡ください。
            </div>
          )}
          {seeding && <div className="text-center text-[10px] text-gray-400 py-2">初期データを準備しています...</div>}
          <main className="py-4">{renderView()}</main>
          <CustomDialog dialog={dialog} onClose={() => setDialog(null)} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
