<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARRCH マネージャー</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="selection:bg-gray-200">
  <div id="root">
    <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background-color: #f9f9f9; font-family: serif; color: #6b7280; letter-spacing: 0.15em;">
      <div style="width: 40px; height: 40px; border: 3px solid #e5e7eb; border-top-color: #1f2937; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
      <p style="font-size: 14px; text-transform: uppercase;">Loading System...</p>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
      </style>
    </div>
  </div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, signInWithCustomToken, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const { useState, useEffect, useMemo, useRef } = React;

    const isPreviewEnv = typeof __firebase_config !== 'undefined' && typeof __initial_auth_token !== 'undefined';
    
    const firebaseConfig = isPreviewEnv ? JSON.parse(__firebase_config) : {
      apiKey: "AIzaSyBCBgmi5yXVndOA6lMxlWmrHszuy8sMgxM",
      authDomain: "hikitugi-539c8.firebaseapp.com",
      projectId: "hikitugi-539c8",
      storageBucket: "hikitugi-539c8.firebasestorage.app",
      messagingSenderId: "311077792020",
      appId: "1:311077792020:web:c737c622e09d42d3447a01"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'arrch-handover-app';

    const BoardIcon = ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>;
    const IdCardIcon = ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="16" rx="2" ry="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line><line x1="7" y1="15" x2="7.01" y2="15"></line><line x1="11" y1="15" x2="15" y2="15"></line></svg>;
    const GridIcon = ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>;
    const FileTextIcon = ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;
    const ListIcon = ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>;
    const PlusIcon = ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>;
    const TrashIcon = ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>;
    const LinkIcon = ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>;
    const EditIcon = ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>;
    const BellIcon = ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>;
    const SettingsIcon = ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
    const ChevronDownIcon = ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 12 15 18 9"></polyline></svg>;
    const ChevronUpIcon = ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="18 15 12 9 6 15"></polyline></svg>;
    const FilterIcon = ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>;
    const BarChartIcon = ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg>;
    const ClockIcon = ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
    const InfoIcon = ({ className = "w-5 h-5" }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;

    const STAGES = [
      { id: '全体', label: '全体' },
      { id: '来場前', label: '来場前' },
      { id: '初回', label: '初回' },
      { id: 'おうちカフェ', label: 'おうちカフェ' },
      { id: 'LP', label: 'LP' },
      { id: 'HB・SB', label: 'HB・SB' },
      { id: '資金計画', label: '資金計画' },
      { id: 'P申込後', label: 'P申込後' },
      { id: '送客後', label: '送客後' }
    ];
    const UI_STAGES = STAGES.filter(s => s.id !== '全体');
    const ARCHIVE_STAGES = [{ id: '引継ぎ完了済', label: '引継ぎ完了済' }, { id: '離脱', label: '離脱' }];
    const CONTENT_OPTIONS = ['おうちカフェ', 'ライフプラン', 'ヒアリングブック', '資金計画'];
    const HURDLE_OPTIONS = ['資金', '土地', '時期', 'デザイン', '会社選び', '建物サイズ', '相談者', '性能/構造'];
    const ASSIGNEE_OPTIONS = ['藤田', '橋本', '市川', '寺田', '小林', '田中', '大峰', '白栁', '乗松', '藤原'];

    const CATEGORY_COLORS = [
      { id: 'slate', name: 'スレート (灰)', bg: 'bg-slate-100', text: 'text-slate-700', border: 'border-slate-200', hex: '#f1f5f9' },
      { id: 'stone', name: 'ストーン (砂)', bg: 'bg-stone-100', text: 'text-stone-700', border: 'border-stone-200', hex: '#f5f5f4' },
      { id: 'rose', name: 'ローズ (薄紅)', bg: 'bg-rose-50', text: 'text-rose-700', border: 'border-rose-200', hex: '#fff1f2' },
      { id: 'amber', name: 'アンバー (琥珀)', bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-200', hex: '#fffbeb' },
      { id: 'emerald', name: 'エメラルド (緑)', bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200', hex: '#ecfdf5' },
      { id: 'teal', name: 'ティール (青緑)', bg: 'bg-teal-50', text: 'text-teal-700', border: 'border-teal-200', hex: '#f0fdfa' },
      { id: 'indigo', name: 'インディゴ (藍)', bg: 'bg-indigo-50', text: 'text-indigo-700', border: 'border-indigo-200', hex: '#eef2ff' },
      { id: 'purple', name: 'パープル (紫)', bg: 'bg-purple-50', text: 'text-purple-700', border: 'border-purple-200', hex: '#faf5ff' }
    ];

    const isOverdue = (dateString) => {
      if (!dateString) return false;
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const targetDate = new Date(dateString.split('T')[0]); targetDate.setHours(0, 0, 0, 0);
      return targetDate.getTime() < today.getTime();
    };

    const isDeadlineNear = (dateString, urgentDays = 5) => {
      if (!dateString) return false;
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const targetDate = new Date(dateString.split('T')[0]); targetDate.setHours(0, 0, 0, 0);
      const diffDays = Math.ceil((targetDate.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
      return diffDays >= 0 && diffDays <= urgentDays;
    };

    const formatDateTime = (dateTimeStr) => {
      if (!dateTimeStr) return '未定';
      const d = new Date(dateTimeStr);
      const datePart = d.toLocaleDateString('ja-JP', { year: 'numeric', month: 'short', day: 'numeric', weekday: 'short' });
      const timePart = dateTimeStr.includes('T') ? d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) : '';
      return timePart ? `${datePart} ${timePart}` : datePart;
    };

    const getTodayString = () => new Date().toISOString().split('T')[0];
    const getCategoryData = (categoryId, categories) => {
      const cat = categories.find(c => c.id === categoryId);
      if(!cat) return null;
      const colorInfo = CATEGORY_COLORS.find(c => c.id === cat.colorId) || CATEGORY_COLORS[0];
      return { ...cat, ...colorInfo };
    };

    const CustomDialog = ({ isOpen, message, type, onConfirm, onCancel }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4 animate-fade-in">
          <div className="bg-white max-w-sm w-full p-8 shadow-xl text-center border border-gray-200">
            <p className="text-sm text-gray-700 mb-8 whitespace-pre-wrap leading-relaxed">{message}</p>
            <div className="flex justify-center gap-4">
              {type === 'confirm' && <button onClick={onCancel} className="px-6 py-2 text-xs tracking-widest text-gray-500 hover:bg-gray-50 transition-colors border border-transparent">キャンセル</button>}
              <button onClick={onConfirm} className="px-8 py-2 text-xs tracking-widest text-white bg-gray-800 hover:bg-gray-900 transition-colors shadow-sm">OK</button>
            </div>
          </div>
        </div>
      );
    };

    const PriorityMeter = ({ priority = 2, onChange, readOnly = false }) => {
      return (
        <div className="flex items-center gap-[3px] shrink-0">
          {[1, 2, 3].map((level) => {
            const isActive = level <= priority;
            let dotClass = 'w-[5px] h-[5px] rounded-full border border-gray-200 bg-transparent transition-colors duration-200';
            if (isActive) dotClass = priority === 3 ? 'w-[5px] h-[5px] rounded-full bg-rose-300 border border-rose-300' : 'w-[5px] h-[5px] rounded-full bg-gray-400 border border-gray-400';
            return (
              <button
                key={level} type="button" disabled={readOnly}
                onClick={(e) => { e.stopPropagation(); if (!readOnly && onChange) onChange(level); }}
                title={level === 1 ? '低' : level === 2 ? '中' : '高'}
                className={`${dotClass} ${readOnly ? 'cursor-default' : 'cursor-pointer hover:opacity-70'}`}
              />
            );
          })}
        </div>
      );
    };

    const FormulaNote = ({ children }) => {
      const [isOpen, setIsOpen] = useState(false);
      return (
        <span className="inline-flex items-center relative">
          <button type="button" onClick={() => setIsOpen(!isOpen)} className="text-gray-300 hover:text-gray-600 transition-colors ml-1.5" title="計算方法">
            <InfoIcon className="w-3.5 h-3.5" />
          </button>
          {isOpen && (
            <div className="absolute left-0 top-6 z-10 w-72 bg-gray-800 text-gray-100 text-[10px] leading-relaxed p-3 shadow-lg tracking-wide whitespace-pre-line normal-case font-sans">
              {children}
            </div>
          )}
        </span>
      );
    };

    const TaskItem = ({ task, contextLabel, isWarning, isPastDue, categories, onChange, onCommit, onToggleDone, onDelete }) => {
      const [localTitle, setLocalTitle] = useState(task.title || '');
      const [localMemo, setLocalMemo] = useState(task.memo || '');
      const [isMemoOpen, setIsMemoOpen] = useState(false);

      useEffect(() => { setLocalTitle(task.title || ''); setLocalMemo(task.memo || ''); }, [task.title, task.memo]);

      const handleBlur = () => { if (localTitle !== task.title || localMemo !== task.memo) onCommit(); };
      const handleKeyDown = (e) => { if (e.key === 'Enter') e.target.blur(); };
      const hasMemoContent = localMemo && localMemo.trim().length > 0;
      const catData = getCategoryData(task.categoryId, categories);

      return (
        <div className={`flex flex-col p-2.5 bg-white border ${task.isDone ? 'border-gray-200 bg-gray-50/80' : (isPastDue ? 'border-rose-300 bg-rose-50/40 shadow-sm' : (isWarning ? 'border-amber-200 shadow-sm' : 'border-gray-200 hover:border-gray-300 transition-colors'))}`}>
          
          {contextLabel && <div className="text-[9px] bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded-sm w-fit mb-1 border border-gray-200 truncate max-w-full">{contextLabel}</div>}

          <div className="flex items-start gap-2.5">
            <input type="checkbox" checked={task.isDone} onChange={onToggleDone} className="mt-1 w-3.5 h-3.5 text-gray-800 border-gray-300 rounded-sm cursor-pointer accent-gray-800 flex-shrink-0" />
            
            <div className="flex-1 min-w-0 flex flex-col gap-1.5">
              <div className="flex flex-col w-full gap-0.5">
                 {catData && !task.isDone && (
                    <div className="flex">
                      <span className={`text-[9px] px-1.5 py-0.5 rounded-sm border ${catData.bg} ${catData.text} ${catData.border} whitespace-nowrap leading-none inline-block`}>{catData.name}</span>
                    </div>
                 )}
                 <div className="flex items-center gap-1">
                   <input type="text" value={localTitle} onChange={(e) => { setLocalTitle(e.target.value); onChange('title', e.target.value); }} onBlur={handleBlur} onKeyDown={handleKeyDown} placeholder="タスク内容" className={`text-sm bg-transparent outline-none flex-1 min-w-0 ${(!task.isDone && task.priority === 3) ? 'font-medium' : 'font-normal'} ${task.isDone ? 'line-through text-gray-400' : (isPastDue ? 'text-rose-800' : 'text-gray-800')}`} />
                   <button onClick={() => setIsMemoOpen(!isMemoOpen)} className="p-1 hover:bg-gray-100 rounded transition-colors flex-shrink-0" title={hasMemoContent ? "メモを編集" : "メモを追加"}><FileTextIcon className={`w-3.5 h-3.5 ${hasMemoContent ? 'text-gray-800' : 'text-gray-300'}`} /></button>
                 </div>
              </div>

              <div className="flex items-center gap-3 flex-wrap">
                 <PriorityMeter priority={task.priority || 2} onChange={(val) => { onChange('priority', val); onCommit(); }} readOnly={task.isDone} />
                 <input type="date" value={task.dueDate || ''} onChange={(e) => { onChange('dueDate', e.target.value); onCommit(); }} className={`text-[10px] outline-none bg-transparent w-[90px] cursor-pointer ${task.isDone ? 'text-gray-400' : (isPastDue ? 'text-rose-600 font-bold' : 'text-gray-500')}`} />
                 
                 {/* カテゴリ選択（詳細行） */}
                 <select value={task.categoryId || ''} onChange={(e) => { onChange('categoryId', e.target.value); onCommit(); }} disabled={task.isDone} className={`text-[10px] outline-none bg-transparent border-b border-dashed border-gray-300 max-w-[80px] truncate cursor-pointer ${task.isDone ? 'text-gray-400 border-transparent' : 'text-gray-500'}`}>
                    <option value="">未分類</option>
                    {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                 </select>
                 
                 <button onClick={onDelete} className="text-gray-300 hover:text-rose-500 text-[10px] px-1 ml-auto opacity-0 group-hover:opacity-100 transition-opacity focus:opacity-100">削除</button>
              </div>
            </div>
          </div>

          {/* メモ開閉エリア */}
          {isMemoOpen && (
            <div className="pl-6 pr-1 pb-1 pt-2 animate-fade-in">
              <textarea value={localMemo} onChange={(e) => { setLocalMemo(e.target.value); onChange('memo', e.target.value); }} onBlur={handleBlur} placeholder="タスクのメモや詳細を入力..." className="w-full text-xs p-2 bg-gray-50/80 border border-gray-200 resize-none h-16 outline-none focus:border-gray-400 transition-colors text-gray-700 leading-relaxed rounded-sm" />
            </div>
          )}
        </div>
      );
    };

    const SettingsView = ({ templates, setTemplates, categories, systemConfig, saveSystemConfig, showConfirm, showAlert }) => {
      const [selectedTab, setSelectedTab] = useState('templates'); // 'templates', 'matrix', 'categories'
      
      // Template State
      const [selectedStage, setSelectedStage] = useState(UI_STAGES[0].id);
      const [newTaskTitle, setNewTaskTitle] = useState('');
      const [newDaysOffset, setNewDaysOffset] = useState(0);
      const [newTaskPriority, setNewTaskPriority] = useState(2);
      const [newBaseDateType, setNewBaseDateType] = useState('stageDate');
      const [newTemplateCategory, setNewTemplateCategory] = useState('');

      const [editingTemplateId, setEditingTemplateId] = useState(null);
      const [editTaskTitle, setEditTaskTitle] = useState('');
      const [editDaysOffset, setEditDaysOffset] = useState(0);
      const [editTaskPriority, setEditTaskPriority] = useState(2);
      const [editBaseDateType, setEditBaseDateType] = useState('stageDate');
      const [editTemplateCategory, setEditTemplateCategory] = useState('');

      // Matrix State
      const [matrixUrgentDays, setMatrixUrgentDays] = useState(systemConfig?.matrixUrgentDays ?? 5);
      const [matrixImportantLevel, setMatrixImportantLevel] = useState(systemConfig?.matrixImportantLevel ?? 3);

      // Conversion Target State（歩留まり目標）

                 </div>
                 <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3">
                   {Array.from({ length: 12 }, (_, i) => i + 1).map(m => {
                     const key = `${targetYear}-${String(m).padStart(2, '0')}`;
                     return (
                       <div key={key}>
                         <label className="block text-[10px] text-gray-500 tracking-widest uppercase mb-1 text-center">{m}月</label>
                         <input type="number" min="0" value={monthlyTargetInputs[key] ?? ''} onChange={e => handleMonthlyTargetChange(key, e.target.value)} placeholder="0" className="w-full border border-gray-300 px-2 py-2 outline-none text-center focus:border-gray-800 bg-white text-sm" />
                       </div>
                     );
                   })}
                 </div>
                 <div className="pt-6 mt-4 border-t border-gray-200">
                   <button onClick={handleSaveMonthlyTargets} className="bg-gray-800 text-white px-8 py-2.5 text-xs tracking-widest hover:bg-gray-900 transition-colors shadow-sm w-full sm:w-auto">設定を保存する</button>
                 </div>
               </div>
             </div>
          )}
        </div>
      );
    };

    function App() {
      const [user, setUser] = useState(null);
      const [authChecking, setAuthChecking] = useState(true);

      const [customers, setCustomers] = useState([]);

      const [dialog, setDialog] = useState({ isOpen: false, message: '', type: 'alert', onConfirm: null });

      const [showStageHistoryModal, setShowStageHistoryModal] = useState(false);

      const [newGenTaskPriority, setNewGenTaskPriority] = useState(2);

      const initialFormState = {

      const showConfirm = (message, onConfirm) => setDialog({ isOpen: true, message, type: 'confirm', onConfirm: () => { onConfirm(); setDialog({ ...dialog, isOpen: false }); } });

      useEffect(() => {

      useEffect(() => {

        // Seed Categories

                ];

             }

        seedCategories();

        // Seed Templates

            const configSnap = await getDoc(configRef);

            if (currentSeedVersion < TARGET_VERSION) {

              const defaults = [
                // 【来場前】

                { stageId: 'HB・SB', title: 'サンクスLINE', daysOffset: 1, priority: 2, baseDateType: 'stageDate', categoryId: 'cat_contact' },
                { stageId: 'HB・SB', title: '顧客テーブル更新', daysOffset: 0, priority: 2, baseDateType: 'stageDate', categoryId: 'cat_doc' },
                { stageId: 'HB・SB', title: 'Rakumoに資金計画書確認タイムを追加', daysOffset: 0, priority: 2, baseDateType: 'stageDate', categoryId: 'cat_mtg' },
                { stageId: 'HB・SB', title: '資金計画書作成', daysOffset: -10, priority: 3, baseDateType: 'nextDate', categoryId: 'cat_doc' },
                { stageId: 'HB・SB', title: '土地探し①', daysOffset: -11, priority: 3, baseDateType: 'nextDate', categoryId: 'cat_research' },

              ];
              for (const t of defaults) {

        };
        seedDefaultTemplates();

        // Backfill stageHistory for customers created before this feature existed
        const seedStageHistory = async () => {
          try {

        };
        seedStageHistory();

        const unsubCustomers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'customers'), (snapshot) => {
          setCustomers(snapshot.docs.map(doc => ({ id: doc.id, currentStage: '来場前', ...doc.data() })));

        const unsubTemplates = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'task_templates'), (snapshot) => setTemplates(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
        const unsubGenTasks = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'general_tasks'), (snapshot) => setGeneralTasks(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
        const unsubCategories = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'task_categories'), (snapshot) => setCategories(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a,b)=>a.createdAt > b.createdAt ? 1 : -1)));
        const unsubConfig = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'system_config', 'default'), (doc) => {
          const data = doc.exists() ? doc.data() : {};
          setSystemConfig({ matrixUrgentDays: data.matrixUrgentDays ?? 5, matrixImportantLevel: data.matrixImportantLevel ?? 3, conversionTargets: data.conversionTargets ?? {}, monthlyTargets: data.monthlyTargets ?? {} });

        return () => { unsubCustomers(); unsubTemplates(); unsubGenTasks(); unsubCategories(); unsubConfig(); };
      }, [user]);

      const activeRemindersCount = useMemo(() => {
        let count = 0;
        customers.forEach(c => {
          if (!ARCHIVE_STAGES.some(s => s.id === c.currentStage)) {
            (c.tasks || []).forEach(t => {
              if (t.title.includes('リマインド') && !t.isDone && t.dueDate && (isOverdue(t.dueDate) || t.dueDate === getTodayString())) count++;
            });
          }
        });
        return count;
      }, [customers]);

      const allTasksList = useMemo(() => {
        const list = [];
        customers.forEach(c => {
          if (!ARCHIVE_STAGES.some(s => s.id === c.currentStage)) {
            (c.tasks || []).forEach(t => {
              if (!t.title.includes('リマインド') && !t.isDone) list.push({ ...t, type: 'customer', customerId: c.id, customerName: c.name, customerStage: c.currentStage, assignee: c.assignee });
            });
          }
        });
        generalTasks.forEach(t => {
           if(!t.isDone) list.push({ ...t, type: 'general', customerName: '-', customerStage: '-', assignee: '-' });
        });
        return list.sort((a, b) => {
          if (taskListSort === 'priorityDesc') {
             const pA = a.priority || 2; const pB = b.priority || 2;
             if (pB !== pA) return pB - pA;
          }
          const da = a.dueDate ? new Date(a.dueDate).getTime() : Infinity;
          const db = b.dueDate ? new Date(b.dueDate).getTime() : Infinity;
          return da - db;
        });
      }, [customers, generalTasks, taskListSort]);

      const filteredAllTasksList = useMemo(() => {
         return allTasksList.filter(t => {
            if (filterCategory === 'all') return true;
            if (filterCategory === 'unassigned') return !t.categoryId;
            return t.categoryId === filterCategory;
         });
      }, [allTasksList, filterCategory]);

      const matrixData = useMemo(() => {
          const q1 = [], q2 = [], q3 = [], q4 = [];
          const urgentDays = systemConfig?.matrixUrgentDays ?? 5;
          const importantLevel = systemConfig?.matrixImportantLevel ?? 3;
          const today = new Date(); today.setHours(0,0,0,0);

          filteredAllTasksList.forEach(t => {
             const isImportant = (t.priority || 2) >= importantLevel;
             let isUrgent = false;
             if (t.dueDate) {
                const tDate = new Date(t.dueDate); tDate.setHours(0,0,0,0);
                const diffDays = Math.ceil((tDate.getTime() - today.getTime()) / (1000*60*60*24));
                if (diffDays <= urgentDays) isUrgent = true;
             }
             if (isImportant && isUrgent) q1.push(t);
             else if (isImportant && !isUrgent) q2.push(t);
             else if (!isImportant && isUrgent) q3.push(t);
             else q4.push(t);
          });
          return { q1, q2, q3, q4 };
      }, [filteredAllTasksList, systemConfig]);

      // --- Analytics (歩留まり・リードタイム分析) ---
      const KEY_CONVERSION_PAIRS = [
        ['初回', 'おうちカフェ'], ['おうちカフェ', 'LP'], ['LP', 'HB・SB'], ['HB・SB', '資金計画'], ['資金計画', 'P申込後'],
        ['初回', 'P申込後'], ['おうちカフェ', 'P申込後']
      ];
      const REVERSE_CALC_STAGES = UI_STAGES.filter(s => ['初回', 'おうちカフェ', 'LP', 'HB・SB', '資金計画'].includes(s.id));
      const MATRIX_STAGES = [...UI_STAGES, ...ARCHIVE_STAGES];

      const getAnalyticsPeriodRange = () => {
        const now = new Date();
        if (analyticsPeriod === 'thisMonth') {
          const y = now.getFullYear(), m = now.getMonth();
          return { start: new Date(y, m, 1).toISOString().split('T')[0], end: new Date(y, m + 1, 0).toISOString().split('T')[0] };
        }
        if (analyticsPeriod === 'thisYear') return { start: `${now.getFullYear()}-01-01`, end: `${now.getFullYear()}-12-31` };
        if (analyticsPeriod === 'custom') return { start: analyticsCustomStart || null, end: analyticsCustomEnd || null };
        return { start: null, end: null };
      };

      const analyticsData = useMemo(() => {
        const { start, end } = getAnalyticsPeriodRange();
        const inRange = (d) => { if (!d) return false; if (start && d < start) return false; if (end && d > end) return false; return true; };

        // Earliest entry date per customer per stage
        const entryDate = {}; // custId -> stageId -> earliest date
        customers.forEach(c => {
          entryDate[c.id] = {};
          (c.stageHistory || []).forEach(h => {
            if (!h || !h.stage || !h.enteredAt) return;
            if (!entryDate[c.id][h.stage] || h.enteredAt < entryDate[c.id][h.stage]) entryDate[c.id][h.stage] = h.enteredAt;
          });
        });

        // All-time "ever reached this stage" sets (used for forecast / reverse-calc, period-independent)
        const reachedAllTime = {};
        MATRIX_STAGES.forEach(s => { reachedAllTime[s.id] = new Set(customers.filter(c => entryDate[c.id][s.id]).map(c => c.id)); });

        // Period-scoped cohort per stage (used for funnel / matrix / lead-time, based on entry date into that stage)
        const cohortByStage = {};
        MATRIX_STAGES.forEach(s => { cohortByStage[s.id] = new Set(customers.filter(c => entryDate[c.id][s.id] && inRange(entryDate[c.id][s.id])).map(c => c.id)); });

        const isActive = (custId) => { const c = customers.find(x => x.id === custId); return c && !ARCHIVE_STAGES.some(a => a.id === c.currentStage); };

        // Generic conversion calculator; useAllTime=true ignores the period filter (forecast/reverse-calc use this)
        const calcConversion = (fromId, toId, useAllTime) => {
          const fromSet = useAllTime ? reachedAllTime[fromId] : cohortByStage[fromId];
          const toSet = reachedAllTime[toId]; // "did they ever reach toId" regardless of date
          if (!fromSet || fromSet.size === 0) return { fromCount: 0, toCount: 0, inProgress: 0, currentRate: null, confirmedRate: null };
          let toCount = 0, inProgress = 0;
          fromSet.forEach(id => {
            if (toSet && toSet.has(id)) toCount++;
            else if (isActive(id)) inProgress++;
          });
          const decided = fromSet.size - inProgress;
          return {
            fromCount: fromSet.size, toCount, inProgress,
            currentRate: (toCount / fromSet.size) * 100,
            confirmedRate: decided > 0 ? (toCount / decided) * 100 : null
          };
        };

        const calcLeadTime = (fromId, toId, useAllTime) => {
          const fromSet = useAllTime ? reachedAllTime[fromId] : cohortByStage[fromId];
          if (!fromSet) return null;
          const diffs = [];
          fromSet.forEach(id => {
            const dFrom = entryDate[id] && entryDate[id][fromId];
            const dTo = entryDate[id] && entryDate[id][toId];
            if (dFrom && dTo) {
              const diff = (new Date(dTo) - new Date(dFrom)) / (1000 * 60 * 60 * 24);
              if (diff >= 0) diffs.push(diff);
            }
          });
          if (diffs.length === 0) return null;
          return diffs.reduce((a, b) => a + b, 0) / diffs.length;
        };

        // 1. Funnel (period-scoped)
        const funnel = UI_STAGES.map(s => ({ stageId: s.id, label: s.label, count: cohortByStage[s.id] ? cohortByStage[s.id].size : 0 }));

        // 2/3. Full matrix (period-scoped current/confirmed rate + lead time), for every i<j pair
        const matrixPairs = [];
        for (let i = 0; i < MATRIX_STAGES.length; i++) {
          for (let j = i + 1; j < MATRIX_STAGES.length; j++) {
            const fromS = MATRIX_STAGES[i], toS = MATRIX_STAGES[j];
            const conv = calcConversion(fromS.id, toS.id, false);
            const leadTime = calcLeadTime(fromS.id, toS.id, false);
            matrixPairs.push({ fromId: fromS.id, fromLabel: fromS.label, toId: toS.id, toLabel: toS.label, ...conv, leadTime });
          }
        }
        const keyConversions = KEY_CONVERSION_PAIRS.map(([fromId, toId]) => {
          const fromS = UI_STAGES.find(s => s.id === fromId), toS = UI_STAGES.find(s => s.id === toId);
          return { fromId, fromLabel: fromS ? fromS.label : fromId, toId, toLabel: toS ? toS.label : toId, ...calcConversion(fromId, toId, false), leadTime: calcLeadTime(fromId, toId, false) };
        });

        // 4. Forecast (always all-time, independent of period filter)
        const forecastChain = UI_STAGES.filter(s => s.id !== forecastTargetStage);
        const targetIdx = UI_STAGES.findIndex(s => s.id === forecastTargetStage);
        const forecastReached = reachedAllTime[forecastTargetStage] ? reachedAllTime[forecastTargetStage].size : 0;
        const forecastBreakdown = UI_STAGES.map((s, idx) => {
          if (targetIdx === -1 || idx >= targetIdx) return null;
          const inProgressNow = customers.filter(c => c.currentStage === s.id).length;
          const conv = calcConversion(s.id, forecastTargetStage, true);
          const contribution = conv.confirmedRate != null ? inProgressNow * (conv.confirmedRate / 100) : 0;
          return { stageId: s.id, label: s.label, inProgressNow, confirmedRate: conv.confirmedRate, contribution };
        }).filter(Boolean);
        const forecastTotal = forecastReached + forecastBreakdown.reduce((sum, b) => sum + b.contribution, 0);

        // 5. Reverse calc helpers (all-time confirmed rate / lead time to P申込後、予想着地の対象ステージ選択とは独立)
        const reachedPMoshikomi = reachedAllTime['P申込後'] ? reachedAllTime['P申込後'].size : 0;
        const reverseRates = REVERSE_CALC_STAGES.map(s => ({
          stageId: s.id, label: s.label,
          confirmedRate: calcConversion(s.id, 'P申込後', true).confirmedRate,
          leadTime: calcLeadTime(s.id, 'P申込後', true),
          currentReached: reachedAllTime[s.id] ? reachedAllTime[s.id].size : 0
        }));

        const totalCustomers = customers.length;
        const completedCount = customers.filter(c => c.currentStage === '引継ぎ完了済').length;
        const droppedCount = customers.filter(c => c.currentStage === '離脱').length;

        return { funnel, matrixPairs, keyConversions, forecastReached, forecastBreakdown, forecastTotal, reverseRates, reachedPMoshikomi, totalCustomers, completedCount, droppedCount };

            {}

                      <tbody className="divide-y divide-gray-100">

                                  <div className="flex items-center gap-2 mb-1">
                                    <div className={`text-sm ${(!task.isDone && task.priority === 3) ? 'font-medium' : 'font-normal'} ${!task.isDone && isOverdue(task.dueDate) ? 'text-rose-700' : 'text-gray-800'}`}>{task.title}</div>
                                    {task.memo && <FileTextIcon className="w-3.5 h-3.5 text-gray-400" title="メモあり"/>}

                                  <PriorityMeter priority={task.priority || 2} readOnly={true} />

                               <td className="p-4">
                                  {catData ? <span className={`text-[10px] px-2 py-1 rounded-sm border ${catData.bg} ${catData.text} ${catData.border} whitespace-nowrap inline-block`}>{catData.name}</span> : <span className="text-[10px] text-gray-400">未分類</span>}
                               </td>
                               <td className="p-4">
                                  {task.type === 'customer' ? (
                                    <>
                                      <div className="font-medium text-gray-800 font-serif tracking-wider cursor-pointer hover:underline" onClick={() => { const cust = customers.find(c => c.id === task.customerId); if(cust) openEditModal(cust); }}>{task.customerName}</div>
                                      <div className="text-[10px] text-gray-400 mt-0.5">{task.customerStage}</div>
                                    </>
                                  ) : <div className="text-[10px] bg-gray-200 text-gray-700 px-2 py-0.5 rounded-sm inline-block tracking-widest">一般タスク</div>}
                               </td>
                               <td className="p-4 text-xs text-gray-500">{task.assignee}</td>
                             </tr>
                           )
                        })}
                        {allTasksList.length === 0 && <tr><td colSpan="6" className="p-8 text-center text-gray-400 text-xs tracking-widest">未完了の通常タスクはありません</td></tr>}
                      </tbody>
                   </table>
                </div>
              </div>
            )}
            
            {}
            {}
            {currentView === 'analytics' && !showFormModal && (
              <div className="space-y-8 animate-fade-in max-w-[1400px] mx-auto">

                {/* 期間フィルター */}
                <div className="bg-white border border-gray-200 shadow-sm p-4 flex flex-wrap items-center gap-4">
                  <span className="text-[10px] text-gray-500 tracking-widest uppercase">期間</span>
                  <select value={analyticsPeriod} onChange={e => setAnalyticsPeriod(e.target.value)} className="text-xs border border-gray-300 bg-white py-2 px-3 outline-none cursor-pointer">
                    <option value="all">全期間</option>
                    <option value="thisMonth">今月</option>
                    <option value="thisYear">今年</option>
                    <option value="custom">カスタム</option>
                  </select>
                  {analyticsPeriod === 'custom' && (
                    <div className="flex items-center gap-2">
                      <input type="date" value={analyticsCustomStart} onChange={e => setAnalyticsCustomStart(e.target.value)} className="text-xs border border-gray-300 bg-white py-1.5 px-2 outline-none" />
                      <span className="text-xs text-gray-400">〜</span>
                      <input type="date" value={analyticsCustomEnd} onChange={e => setAnalyticsCustomEnd(e.target.value)} className="text-xs border border-gray-300 bg-white py-1.5 px-2 outline-none" />
                    </div>
                  )}
                  <span className="text-[10px] text-gray-400 tracking-wider">※各ステージへ「その期間内に入った顧客」を対象に集計します（予想着地・必要数の逆算は期間の影響を受けません）</span>
                </div>

                {/* 1. ファネル */}
                <div className="bg-white border border-gray-200 shadow-sm p-8">
                  <h2 className="text-lg font-serif tracking-[0.2em] text-gray-800 flex items-center gap-2 mb-6"><BarChartIcon className="w-5 h-5" /> ファネル</h2>
                  <div className="space-y-2">
                    {analyticsData.funnel.map((f, idx) => {
                      const maxCount = analyticsData.funnel[0] ? analyticsData.funnel[0].count : 0;
                      const pct = maxCount > 0 ? Math.max((f.count / maxCount) * 100, f.count > 0 ? 4 : 0) : 0;
                      const ratioOfFirst = maxCount > 0 ? Math.round((f.count / maxCount) * 100) : 0;
                      return (
                        <div key={f.stageId} className="flex items-center gap-3">
                          <span className="w-24 text-xs text-gray-600 tracking-wider text-right shrink-0">{f.label}</span>
                          <div className="flex-1 bg-gray-100 h-6 relative">
                            <div className="bg-gray-800 h-6 flex items-center justify-end px-2" style={{ width: `${pct}%` }}></div>
                          </div>
                          <span className="w-28 text-xs text-gray-700 shrink-0"><strong className="font-serif text-sm">{f.count}</strong> 件（{idx === 0 ? '100' : ratioOfFirst}%）</span>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* 2/3. 歩留まり・リードタイム */}
                <div className="bg-white border border-gray-200 shadow-sm p-8">
                  <h2 className="text-lg font-serif tracking-[0.2em] text-gray-800 flex items-center gap-2 mb-1">
                    <GridIcon className="w-5 h-5" /> 歩留まり・リードタイム
                    <FormulaNote>
                      {"現状の歩留まり = 到達数(先) ÷ 到達数(元) × 100\n\n確定歩留まり = 到達数(先) ÷ (到達数(元) − 進行中人数)\n※進行中＝元のステージには到達したが、まだ先のステージに到達しておらず、完了・離脱もしていない顧客。まだ結果が決まっていない人を分母から除くことで、進行中の人が多いために低く出過ぎるのを防ぎます。\n\nリードタイム = 先のステージに到達した顧客について、元→先の日数の平均"}
                    </FormulaNote>
                  </h2>
                  <p className="text-[10px] text-gray-400 tracking-wider mb-6">目標値は「設定 &gt; 歩留まり目標」で入力できます。目標未達は赤字、目標達成は緑字で表示されます。</p>

                  <h3 className="text-xs font-bold text-gray-600 tracking-widest uppercase mb-3">主要な歩留まり</h3>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
                    {analyticsData.keyConversions.map((k) => {
                      const targetKey = `${k.fromId}|${k.toId}`;
                      const target = systemConfig?.conversionTargets?.[targetKey];
                      const rate = k.confirmedRate;
                      let colorClass = 'text-gray-800';
                      if (target != null && rate != null) colorClass = rate >= target ? 'text-emerald-600' : 'text-rose-600';
                      return (
                        <div key={targetKey} className="bg-gray-50 border border-gray-200 p-4">
                          <div className="text-[10px] text-gray-500 tracking-wider mb-2">{k.fromLabel} → {k.toLabel}</div>
                          <div className={`text-2xl font-serif ${colorClass}`}>{rate != null ? rate.toFixed(0) : '−'}<span className="text-xs ml-0.5">%</span></div>
                          <div className="text-[9px] text-gray-400 mt-1">現状 {k.currentRate != null ? k.currentRate.toFixed(0) : '−'}% ／ 目標 {target != null ? target + '%' : '未設定'}</div>
                          <div className="text-[9px] text-gray-400">リードタイム平均 {k.leadTime != null ? k.leadTime.toFixed(0) + '日' : '−'}</div>
                        </div>
                      );
                    })}
                  </div>

                  <h3 className="text-xs font-bold text-gray-600 tracking-widest uppercase mb-3 border-t border-gray-200 pt-6">全ステージ間マトリクス</h3>
                  <div className="overflow-x-auto [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none]">
                    <table className="w-full text-left border-collapse min-w-[700px]">
                      <thead>
                        <tr className="border-b border-gray-200 text-[10px] text-gray-400 uppercase tracking-widest bg-gray-50/50">
                          <th className="p-3 font-normal">から</th><th className="p-3 font-normal">へ</th>
                          <th className="p-3 font-normal">現状</th><th className="p-3 font-normal">確定</th>
                          <th className="p-3 font-normal">目標</th><th className="p-3 font-normal">リードタイム</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100">
                        {analyticsData.matrixPairs.map(p => {
                          const targetKey = `${p.fromId}|${p.toId}`;
                          const target = systemConfig?.conversionTargets?.[targetKey];
                          let colorClass = 'text-gray-800';
                          if (target != null && p.confirmedRate != null) colorClass = p.confirmedRate >= target ? 'text-emerald-600' : 'text-rose-600';
                          return (
                            <tr key={targetKey} className="hover:bg-gray-50 transition-colors">
                              <td className="p-3 text-xs text-gray-700">{p.fromLabel}</td>
                              <td className="p-3 text-xs text-gray-700">{p.toLabel}</td>
                              <td className="p-3 text-xs text-gray-500">{p.currentRate != null ? p.currentRate.toFixed(0) + '%' : '−'}</td>
                              <td className={`p-3 text-xs font-medium ${colorClass}`}>{p.confirmedRate != null ? p.confirmedRate.toFixed(0) + '%' : '−'}</td>
                              <td className="p-3 text-xs text-gray-400">{target != null ? target + '%' : '−'}</td>
                              <td className="p-3 text-xs text-gray-500">{p.leadTime != null ? p.leadTime.toFixed(0) + '日' : '−'}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* 4. 予想着地 */}
                <div className="bg-white border border-gray-200 shadow-sm p-8">
                  <h2 className="text-lg font-serif tracking-[0.2em] text-gray-800 flex items-center gap-2 mb-1">
                    <ClockIcon className="w-5 h-5" /> 予想着地
                    <FormulaNote>
                      {"予想着地数 = 到達済みの人数\n  + Σ [ 対象ステージより手前の各ステージkについて、現在kで進行中の人数 × 確定歩留まり(k→対象ステージ) ]\n\n現在進行中の顧客も、これまでの確定歩留まりの実力値に応じて加算されます（期間フィルターの影響を受けず、常に現在の全データで計算）"}
                    </FormulaNote>
                  </h2>
                  <div className="flex items-center gap-3 mb-6">
                    <span className="text-[10px] text-gray-500 tracking-widest uppercase">対象ステージ</span>
                    <select value={forecastTargetStage} onChange={e => setForecastTargetStage(e.target.value)} className="text-xs border border-gray-300 bg-white py-2 px-3 outline-none cursor-pointer">
                      {UI_STAGES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                    </select>
                  </div>
                  <div className="flex flex-wrap items-end gap-8">
                    <div>
                      <div className="text-[10px] text-gray-500 tracking-widest uppercase mb-1">到達済み</div>
                      <div className="text-3xl font-serif text-gray-800">{analyticsData.forecastReached}<span className="text-sm ml-1">件</span></div>
                    </div>
                    <div className="text-2xl text-gray-300">+</div>
                    <div>
                      <div className="text-[10px] text-gray-500 tracking-widest uppercase mb-1">進行中からの見込み</div>
                      <div className="text-3xl font-serif text-gray-800">{(analyticsData.forecastTotal - analyticsData.forecastReached).toFixed(1)}<span className="text-sm ml-1">件</span></div>
                    </div>
                    <div className="text-2xl text-gray-300">=</div>
                    <div>
                      <div className="text-[10px] text-gray-500 tracking-widest uppercase mb-1">予想着地</div>
                      <div className="text-3xl font-serif text-gray-900 font-bold">{analyticsData.forecastTotal.toFixed(1)}<span className="text-sm ml-1">件</span></div>
                    </div>
                  </div>
                  {analyticsData.forecastBreakdown.length > 0 && (
                    <div className="mt-6 border-t border-gray-200 pt-4 space-y-1">
                      {analyticsData.forecastBreakdown.map(b => (
                        <div key={b.stageId} className="flex justify-between text-[11px] text-gray-500">
                          <span>{b.label}：進行中 {b.inProgressNow}件 × 確定歩留まり {b.confirmedRate != null ? b.confirmedRate.toFixed(0) + '%' : '−'}</span>
                          <span className="text-gray-700">{b.contribution.toFixed(1)}件</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* 5. 必要数の逆算 */}
                <div className="bg-white border border-gray-200 shadow-sm p-8">
                  <h2 className="text-lg font-serif tracking-[0.2em] text-gray-800 flex items-center gap-2 mb-1">
                    <FilterIcon className="w-5 h-5" /> 必要数の逆算
                    <FormulaNote>
                      {"必要数(ステージk) = 目標棟数 ÷ 確定歩留まり(k→P申込後)\n\n月間の必要月 = 対象月 − 平均リードタイム(k→P申込後)（月単位に換算・四捨五入）\n\n目標棟数は「設定 > P申込目標」で入力します。年間目標は12ヶ月分の合計として自動算出されます。"}
                    </FormulaNote>
                  </h2>
                  <p className="text-[10px] text-gray-400 tracking-wider mb-6">「設定 &gt; P申込目標」で入力した棟数目標を元に、各手前ステージで何件必要かを逆算します。</p>

                  <h3 className="text-xs font-bold text-gray-600 tracking-widest uppercase mb-3">年間ベースの逆ファネル（{new Date().getFullYear()}年）</h3>
                  {(() => {
                    const year = new Date().getFullYear();
                    const annualTarget = Array.from({ length: 12 }, (_, m) => systemConfig?.monthlyTargets?.[`${year}-${String(m + 1).padStart(2, '0')}`] || 0).reduce((a, b) => a + b, 0);
                    if (annualTarget === 0) return <div className="text-xs text-gray-400 py-6 text-center border border-dashed border-gray-200 mb-8">「設定 &gt; P申込目標」で{year}年の月間目標を入力してください</div>;
                    const rows = [...analyticsData.reverseRates, { stageId: 'P申込後', label: 'P申込後', confirmedRate: 100, leadTime: 0, currentReached: analyticsData.reachedPMoshikomi }];
                    return (
                      <div className="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-8">
                        {rows.map(r => {
                          const required = r.stageId === 'P申込後' ? annualTarget : (r.confirmedRate ? Math.ceil(annualTarget / (r.confirmedRate / 100)) : null);
                          const ok = required != null && r.currentReached >= required;
                          return (
                            <div key={r.stageId} className="bg-gray-50 border border-gray-200 p-4 text-center">
                              <div className="text-[10px] text-gray-500 tracking-wider mb-2">{r.label}</div>
                              <div className={`text-xl font-serif ${required == null ? 'text-gray-400' : (ok ? 'text-emerald-600' : 'text-rose-600')}`}>{required != null ? required : '−'}<span className="text-xs ml-0.5">件必要</span></div>
                              <div className="text-[9px] text-gray-400 mt-1">現在 {r.currentReached}件</div>
                            </div>
                          );
                        })}
                      </div>
                    );
                  })()}

                  <h3 className="text-xs font-bold text-gray-600 tracking-widest uppercase mb-3 border-t border-gray-200 pt-6">月間ベース（リードタイム考慮）</h3>
                  {(() => {
                    const year = new Date().getFullYear();
                    const months = Array.from({ length: 12 }, (_, i) => i + 1);
                    const hasAnyTarget = months.some(m => (systemConfig?.monthlyTargets?.[`${year}-${String(m).padStart(2, '0')}`] || 0) > 0);
                    if (!hasAnyTarget) return <div className="text-xs text-gray-400 py-6 text-center border border-dashed border-gray-200">「設定 &gt; P申込目標」で月間目標を入力すると、月別の必要件数がここに表示されます</div>;
                    return (
                      <div className="overflow-x-auto [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none]">
                        <table className="w-full text-left border-collapse min-w-[900px]">
                          <thead>
                            <tr className="border-b border-gray-200 text-[10px] text-gray-400 uppercase tracking-widest bg-gray-50/50">
                              <th className="p-2 font-normal sticky left-0 bg-gray-50/50">ステージ</th>
                              {months.map(m => <th key={m} className="p-2 font-normal text-center">{m}月</th>)}
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-gray-100">
                            <tr className="bg-gray-50/30">
                              <td className="p-2 text-[10px] text-gray-500 sticky left-0 bg-gray-50/30">P申込後（目標）</td>
                              {months.map(m => {
                                const t = systemConfig?.monthlyTargets?.[`${year}-${String(m).padStart(2, '0')}`] || 0;
                                return <td key={m} className="p-2 text-center text-xs text-gray-700">{t > 0 ? t : ''}</td>;
                              })}
                            </tr>
                            {analyticsData.reverseRates.map(r => {
                              const shiftMonths = r.leadTime != null ? Math.round(r.leadTime / 30) : 0;
                              const cellByMonth = {};
                              months.forEach(m => {
                                const targetVal = systemConfig?.monthlyTargets?.[`${year}-${String(m).padStart(2, '0')}`] || 0;
                                if (targetVal > 0 && r.confirmedRate) {
                                  const requiredCount = Math.ceil(targetVal / (r.confirmedRate / 100));
                                  let destMonth = m - shiftMonths;
                                  if (destMonth >= 1 && destMonth <= 12) cellByMonth[destMonth] = (cellByMonth[destMonth] || 0) + requiredCount;
                                }
                              });
                              return (
                                <tr key={r.stageId}>
                                  <td className="p-2 text-[10px] text-gray-600 sticky left-0 bg-white">{r.label}</td>
                                  {months.map(m => (
                                    <td key={m} className="p-2 text-center text-xs text-gray-800">{cellByMonth[m] || ''}</td>
                                  ))}
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    );
                  })()}
                </div>

                {/* 6. 完了・離脱サマリー */}
                <div className="bg-white border border-gray-200 shadow-sm p-8">
                  <h2 className="text-lg font-serif tracking-[0.2em] text-gray-800 flex items-center gap-2 mb-6"><IdCardIcon className="w-5 h-5" /> 完了・離脱サマリー</h2>

                       </div>
                       <span className="bg-amber-200/50 text-amber-800 text-[10px] font-bold px-2 py-1 rounded-sm">{matrixData.q3.length}</span>
                     </div>
                     <div className="p-3 space-y-2.5 flex-grow overflow-y-auto max-h-[600px] [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-track]:bg-transparent [&::-webkit-scrollbar-thumb]:bg-amber-200 hover:[&::-webkit-scrollbar-thumb]:bg-amber-300">
                       {matrixData.q3.length === 0 ? <p className="text-[10px] text-amber-300 text-center py-8">該当タスクはありません</p> : 
                         matrixData.q3.map(task => (
                           <TaskItem 
                              key={task.id} task={task} contextLabel={task.type === 'customer' ? `[顧客] ${task.customerName}様` : '[一般タスク]'} categories={categories}
                              isWarning={isDeadlineNear(task.dueDate)} isPastDue={isOverdue(task.dueDate)}
                              onChange={(f,v) => task.type === 'customer' ? updateTaskLocal(task.customerId, task.id, f, v) : updateGeneralTaskLocal(task.id, f, v)}
                              onCommit={() => task.type === 'customer' ? commitTaskUpdate(task.customerId) : commitGeneralTaskUpdate(task.id)}
                              onToggleDone={() => task.type === 'customer' ? toggleTaskDone(task.customerId, task.id) : toggleGeneralTaskDone(task.id)}
                              onDelete={() => task.type === 'customer' ? deleteTask(task.customerId, task.id) : deleteGeneralTask(task.id)}
                           />
                         ))
                       }
                     </div>
                  </div>

                  {/* Q4: Not Urgent & Not Important */}
                  <div className="bg-gray-50/80 border border-gray-200 flex flex-col h-full min-h-[350px]">
                     <div className="bg-gray-200/60 p-3 border-b border-gray-200 flex justify-between items-center">
                       <div>
                         <h4 className="text-sm font-bold text-gray-700 tracking-widest">第4象限：後回し/やめる</h4>
                         <p className="text-[10px] text-gray-500 tracking-wider">重要度 低 ＆ 期日 遠い(未定)</p>
                       </div>
                       <span className="bg-gray-300/50 text-gray-600 text-[10px] font-bold px-2 py-1 rounded-sm">{matrixData.q4.length}</span>
                     </div>
                     <div className="p-3 space-y-2.5 flex-grow overflow-y-auto max-h-[600px] [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-track]:bg-transparent [&::-webkit-scrollbar-thumb]:bg-gray-200 hover:[&::-webkit-scrollbar-thumb]:bg-gray-300">
                       {matrixData.q4.length === 0 ? <p className="text-[10px] text-gray-400 text-center py-8">該当タスクはありません</p> : 
                         matrixData.q4.map(task => (
                           <TaskItem 
                              key={task.id} task={task} contextLabel={task.type === 'customer' ? `[顧客] ${task.customerName}様` : '[一般タスク]'} categories={categories}
                              isWarning={false} isPastDue={false}
                              onChange={(f,v) => task.type === 'customer' ? updateTaskLocal(task.customerId, task.id, f, v) : updateGeneralTaskLocal(task.id, f, v)}
                              onCommit={() => task.type === 'customer' ? commitTaskUpdate(task.customerId) : commitGeneralTaskUpdate(task.id)}
                              onToggleDone={() => task.type === 'customer' ? toggleTaskDone(task.customerId, task.id) : toggleGeneralTaskDone(task.id)}
                              onDelete={() => task.type === 'customer' ? deleteTask(task.customerId, task.id) : deleteGeneralTask(task.id)}
                           />
                         ))
                       }
                     </div>
                  </div>
                </div>
              </div>
            )}

            {}
            {currentView === 'remind' && !showFormModal && (
              <div className="bg-white border border-gray-200 overflow-hidden shadow-sm animate-fade-in">
                <div className="p-6 border-b border-gray-200 bg-white flex items-center gap-2">
                  <BellIcon className="w-5 h-5 text-gray-800" /><h2 className="text-lg font-serif tracking-[0.2em] text-gray-800">リマインドタスク一覧</h2>
                </div>
                <div className="overflow-x-auto [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none]">
                   <table className="w-full text-left border-collapse min-w-[800px]">
                      <thead>
                        <tr className="border-b border-gray-200 text-[10px] text-gray-400 uppercase tracking-widest bg-gray-50/50">
                           <th className="p-4 font-normal w-12 text-center">Done</th>
                           <th className="p-4 font-normal">Due Date</th>
                           <th className="p-4 font-normal">Customer</th>
                           <th className="p-4 font-normal">Task Name</th>
                           <th className="p-4 font-normal">Stage</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100">
                        {customers.flatMap(c => (c.tasks || []).map(t => ({customer: c, task: t}))).filter(item => item.task.title.includes('リマインド')).sort((a,b) => new Date(a.task.dueDate) - new Date(b.task.dueDate)).map(({ customer, task }) => (
                           <tr key={task.id} className={`hover:bg-gray-50 transition-colors ${task.isDone ? 'opacity-50 bg-gray-50' : ''}`}>
                             <td className="p-4 text-center"><input type="checkbox" checked={task.isDone} onChange={() => toggleTaskDone(customer.id, task.id)} className="accent-gray-800 cursor-pointer"/></td>
                             <td className={`p-4 text-sm ${!task.isDone && isOverdue(task.dueDate) ? 'text-rose-600 font-medium' : 'text-gray-600'}`}>{task.dueDate}{!task.isDone && isOverdue(task.dueDate) && <span className="ml-2 text-[9px] bg-rose-100 text-rose-700 px-1 border border-rose-200">期限切れ</span>}</td>
                             <td className="p-4 font-medium text-gray-800 font-serif tracking-wider">{customer.name}</td>
                             <td className="p-4 text-sm text-gray-600">{task.title}</td>
                             <td className="p-4 text-xs text-gray-500">{customer.currentStage}</td>
                           </tr>
                        ))}
                        {customers.flatMap(c => (c.tasks || []).map(t => ({customer: c, task: t}))).filter(item => item.task.title.includes('リマインド')).length === 0 && (
                          <tr><td colSpan="5" className="p-8 text-center text-gray-400 text-xs tracking-widest">リマインドタスクはありません</td></tr>
                        )}
                      </tbody>
                   </table>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
